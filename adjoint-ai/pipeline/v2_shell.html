<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Guillaume Helleu · Exercice de la 2e étape · réf. 566</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@page{size:A4;margin:14mm 0 16mm 0;
 @bottom-left{content:"Guillaume Helleu · Adjoint Architecture d'intérieur · réf. 566";font:600 6.3pt Archivo;letter-spacing:.08em;text-transform:uppercase;color:#8b887f;padding-left:15mm}
 @bottom-right{content:counter(page) " / " counter(pages);font:600 6.5pt Archivo;color:#8b887f;padding-right:15mm}}
:root{--ink:#121212;--g:#8b887f;--g2:#b9b6ad;--line:#d9d6cf;--red:#e6483a;--paper:#f2f0eb}
*{box-sizing:border-box}
html{font:400 8.4pt/1.42 Archivo,Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;font-feature-settings:"tnum" 1}
body{margin:0}
p{margin:0 0 5pt}
a{color:var(--ink);text-decoration:none;border-bottom:.4pt solid var(--g2)}
sup{font-size:5.4pt;font-weight:600;color:var(--red);line-height:0;margin-left:.6pt;vertical-align:4pt}
sup.o{color:inherit;font-weight:400;font-size:5.6pt;margin-left:0}
i{font-style:italic}
.lab{font:600 6.4pt/1.3 Archivo;letter-spacing:.14em;text-transform:uppercase;color:var(--g);margin:0}

/* bandeau */
.band{background:#0b0b0b;color:#f2f0eb;padding:13mm 15mm 7mm;margin:0 -15mm 7mm}
.wrap{padding:0 15mm}
.band .lab{color:#8b887f}
.band h1{font:500 34pt/.92 Archivo;font-stretch:88%;letter-spacing:-.035em;margin:7pt 0 8pt}
.band h1 span{color:#6f6c66}
.band .by{font:500 8pt Archivo;color:#c9c6be;margin:0 0 8mm;letter-spacing:.02em}
.band img{display:block;width:100%}
.band .cap{font-size:6.6pt;color:#8b887f;margin:4pt 0 0}
.band sup{color:#e6483a}
.lede,.tools{margin-left:0;margin-right:0}
.cov{padding:0 15mm}
.lede{font-size:9.6pt;line-height:1.45;margin-bottom:5mm;max-width:none}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5mm;margin-bottom:2mm}
.tools div{border-top:1.2pt solid var(--ink);padding-top:4pt}
.tools a{display:inline-block;font:600 8pt Archivo;border-bottom:1pt solid var(--red);margin:3pt 0 3pt}
.tools p:last-child{font-size:7.4pt;color:#4a4842;line-height:1.35}

/* questions */
.q{page-break-before:auto;margin-top:9mm}.q1{page-break-before:auto;margin-top:7mm}
.qh{display:grid;grid-template-columns:22mm 1fr;align-items:end;border-bottom:1.2pt solid var(--ink);padding-bottom:5pt;margin-bottom:6pt}
.qh span{font:400 58pt/.78 Archivo;font-stretch:80%;letter-spacing:-.04em}
.qh h2{font:500 21pt/.98 Archivo;font-stretch:88%;letter-spacing:-.025em;margin:0}
.qh h2 em{font-style:normal;color:var(--g2)}
.intro{font-size:9.4pt;line-height:1.46;margin:7pt 0 6pt;column-count:2;column-gap:7mm}
h3{font:600 9.6pt Archivo;margin:10pt 0 4pt;letter-spacing:-.005em;break-after:avoid}
h3 b{font-weight:600;color:var(--red);margin-right:5pt}

/* tableaux */
table{width:100%;border-collapse:collapse;margin:3pt 0 6pt;font-size:7.5pt;line-height:1.32}
tr{break-inside:avoid}
th{font:600 6.2pt Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--g);text-align:left;padding:3pt 5pt 3pt 0;border-bottom:1pt solid var(--ink)}
td{vertical-align:top;padding:4pt 6pt 4pt 0;border-bottom:.5pt solid var(--line)}
table.k3 td:first-child{font-weight:600;width:19%}
table.k3 td:nth-child(2){width:41%}
table.k3n td:first-child{font-weight:500;width:12%;white-space:nowrap}
table.k3n td:nth-child(2){width:17%}
table.k2 td:first-child{width:26%}
table.r2 td:first-child{width:36%;font-weight:500}
table.act td:first-child{width:22%;font-weight:600;font-size:8.2pt;line-height:1.2}
table.act td:first-child b{display:block;font:500 17pt/1 Archivo;font-stretch:80%;color:var(--red);margin-bottom:2pt}
table.act td:last-child{width:22%;color:#4a4842}
table.trk td{white-space:nowrap}table.trk td:nth-child(2){white-space:normal}
.st{font:600 6pt Archivo;letter-spacing:.1em;text-transform:uppercase}
.st.ok{color:var(--g)}.st.al{color:#fff;background:var(--red);padding:.5pt 3pt}.st.go{color:var(--ink)}.st.no{color:var(--g)}
.fig{margin:4pt 0 4pt}.fig svg{display:block}
.fig figcaption{font-size:6.6pt;color:var(--g);margin-top:2pt}
.fig.g{margin:4pt 0 2pt}
ul.pts{list-style:none;padding:0;margin:4pt 0}
ul.pts li{position:relative;padding:4pt 0 4pt 0;border-top:.5pt solid var(--line);font-size:8.3pt}
ul.pts li b{font-weight:600}
.prio{display:grid;grid-template-columns:30mm 1fr;gap:5mm;border-top:1.2pt solid var(--red);padding-top:5pt;margin-top:6pt;break-inside:avoid}
.prio .lab{color:var(--red)}
.prio p:last-child{font-size:8.6pt}
ol.crit{list-style:none;padding:0;margin:4pt 0 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 6mm;counter-reset:c}
ol.crit li{counter-increment:c;border-top:.6pt solid var(--ink);padding:4pt 0 6pt 0;font-size:7.6pt;color:#3a3833;break-inside:avoid}
ol.crit li::before{content:counter(c);display:block;font:500 15pt/1 Archivo;font-stretch:80%;color:var(--red);margin-bottom:2pt}
ol.crit li b{display:block;color:var(--ink);font-weight:600;font-size:8pt;margin-bottom:1pt}
.annex{page-break-before:always}
.ah{font:500 21pt/1 Archivo;font-stretch:88%;letter-spacing:-.025em;margin:4pt 0 8pt;border-bottom:1.2pt solid var(--ink);padding-bottom:5pt}
ol.refs{margin:0;padding-left:16pt;font-size:7.8pt}ol.refs li{padding:3pt 0;border-bottom:.5pt solid var(--line)}
ol.refs li::marker{color:var(--red);font-weight:600}
ol.refs a{border:0;color:var(--g);word-break:break-all}
.note{font-size:7pt;color:var(--g);margin-top:6pt}
</style></head><body><div class="wrap">
{{BODY}}
</div></body></html>
