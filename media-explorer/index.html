<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Media Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<style>
/* Media Explorer · dark-first, glass UI floating over a full-bleed map */
:root{
  --bg:#08080a; --glow1:rgba(86,0,2,.55); --glow2:rgba(166,200,255,.16); --glow3:rgba(59,51,2,.35);
  --fg:#f6f3ee; --soft:rgba(246,243,238,.62); --faint:rgba(246,243,238,.32);
  --glass:rgba(28,26,30,.46); --glass-hi:rgba(255,255,255,.10); --edge:rgba(255,255,255,.14); --edge-top:rgba(255,255,255,.28);
  --knob:#ffffff; --knob-fg:#0c0b0d; --accent:#a6c8ff; --accent-2:#ff8f86; --link:rgba(166,200,255,.55);
  --shadow:0 18px 50px -12px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.35);
  --ui:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:22px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e9e6e1; --glow1:rgba(166,200,255,.55); --glow2:rgba(242,233,215,.9); --glow3:rgba(255,143,134,.22);
  --fg:#141216; --soft:rgba(20,18,22,.62); --faint:rgba(20,18,22,.32);
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.65); --edge:rgba(20,18,22,.08); --edge-top:rgba(255,255,255,.9);
  --knob:#141216; --knob-fg:#ffffff; --accent:#1d4fd7; --accent-2:#b0261d; --link:rgba(29,79,215,.5);
  --shadow:0 18px 50px -14px rgba(40,30,20,.28),0 2px 6px rgba(40,30,20,.08); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#e9e6e1; --glow1:rgba(166,200,255,.55); --glow2:rgba(242,233,215,.9); --glow3:rgba(255,143,134,.22);
  --fg:#141216; --soft:rgba(20,18,22,.62); --faint:rgba(20,18,22,.32);
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.65); --edge:rgba(20,18,22,.08); --edge-top:rgba(255,255,255,.9);
  --knob:#141216; --knob-fg:#ffffff; --accent:#1d4fd7; --accent-2:#b0261d; --link:rgba(29,79,215,.5);
  --shadow:0 18px 50px -14px rgba(40,30,20,.28),0 2px 6px rgba(40,30,20,.08); color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60vmax 50vmax at 12% 8%,var(--glow1),transparent 60%),radial-gradient(55vmax 45vmax at 92% 88%,var(--glow2),transparent 60%),radial-gradient(40vmax 40vmax at 70% 10%,var(--glow3),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),var(--shadow);border-radius:var(--r)}
.stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
/* ---------- top layer ---------- */
.top{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:14px;pointer-events:none;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.top>*{pointer-events:auto}
.brand{padding:14px 22px 15px 20px;display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-weight:760;font-size:30px;letter-spacing:-.045em;line-height:.95;font-variation-settings:"wdth" 82,"opsz" 96}
.brand h1 i{font-style:normal;font-weight:300;letter-spacing:-.03em}
.brand a{color:inherit;text-decoration:none;font-size:13px;color:var(--soft);font-variation-settings:"opsz" 14}
.brand a:hover{color:var(--fg)}
.brand a b{font-weight:650;color:var(--fg);font-variant-numeric:tabular-nums}
.seg{position:relative;display:flex;padding:5px;gap:2px;border-radius:999px}
.seg .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--knob);box-shadow:0 6px 18px -6px rgba(0,0,0,.5);
  transition:transform .42s cubic-bezier(.3,1.35,.45,1),width .42s cubic-bezier(.3,1.35,.45,1);z-index:0}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;padding:10px 17px;border-radius:999px;font-size:15px;font-weight:520;letter-spacing:-.01em;color:var(--soft);
  white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .25s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{color:var(--knob-fg)}
.seg button:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.seg sup{font-size:11px;font-weight:600;line-height:1;top:0;padding:3px 6px;border-radius:999px;background:var(--glass-hi);color:inherit;opacity:.8}
.seg button[aria-pressed="true"] sup{background:rgba(128,128,128,.18)}
.spacer{flex:1}
.seg:empty,.legend:empty{display:none}
/* ---------- dock ---------- */
.dock{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;padding:8px 8px 8px 22px;border-radius:999px}
.dock .lab{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--soft);white-space:nowrap}
.rng{position:relative;width:220px;height:30px;display:flex;align-items:center}
.rng input{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;position:relative;z-index:1}
.rng input::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--fg) 0 var(--p,30%),var(--faint) var(--p,30%) 100%)}
.rng input::-moz-range-track{height:8px;border-radius:99px;background:var(--faint)}
.rng input::-moz-range-progress{height:8px;border-radius:99px;background:var(--fg)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--knob);border:3px solid var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s}
.rng input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--knob);border:3px solid var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.rng input:active::-webkit-slider-thumb{transform:scale(1.18)}
.rng input:focus-visible{outline:none}
.rng input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--link)}
.val{min-width:52px;font-size:22px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 80}
.val small{font-size:13px;font-weight:500;opacity:.55;margin-right:1px}
.rb{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass-hi);border:1px solid var(--edge);transition:transform .18s,background .2s}
.rb:hover{transform:scale(1.07);background:var(--knob);color:var(--knob-fg)}
.rb:active{transform:scale(.95)}
.rb svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--edge)}
/* ---------- caption ---------- */
.legend{position:absolute;z-index:2;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:300px;padding:16px 18px;font-size:13px;line-height:1.45;color:var(--soft)}
.legend b{display:block;font-size:20px;font-weight:700;letter-spacing:-.035em;color:var(--fg);margin-bottom:4px;font-variation-settings:"wdth" 85}
.legend .hint{display:block;margin-top:8px;font-size:12px;color:var(--faint)}
/* ---------- tooltip ---------- */
.tip{position:absolute;z-index:4;pointer-events:none;display:flex;gap:10px;align-items:center;padding:7px 14px 7px 7px;border-radius:16px;max-width:300px}
.tip img{width:40px;height:52px;object-fit:cover;border-radius:9px;display:block}
.tip b{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;color:var(--fg)}
.tip span{display:block;font-size:12px;color:var(--soft)}
/* ---------- panel ---------- */
.panel{position:absolute;z-index:4;top:calc(104px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:360px;
  border-radius:30px;overflow:auto;display:flex;flex-direction:column;padding:10px;scrollbar-width:none;animation:pin .45s cubic-bezier(.2,1.2,.4,1)}
.panel::-webkit-scrollbar{display:none}
@keyframes pin{from{opacity:0;transform:translateX(24px) scale(.97)}}
.panel .fig{position:relative;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.25);flex:none}
.panel img.big{width:100%;aspect-ratio:4/5;object-fit:contain;display:block}
.panel .code{position:absolute;left:12px;top:12px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:650;letter-spacing:.01em}
.close{all:unset;cursor:pointer;position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.close:hover{background:var(--knob);color:var(--knob-fg)}
.panel .pb{padding:18px 10px 8px;display:flex;flex-direction:column;gap:18px}
.panel .n{font-size:34px;font-weight:760;line-height:.98;letter-spacing:-.05em;font-variation-settings:"wdth" 82,"opsz" 96}
.panel .s{font-size:14px;color:var(--soft);margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{padding:12px 14px;border-radius:16px;background:var(--glass-hi);border:1px solid var(--edge)}
.stats b{display:block;font-size:26px;font-weight:720;letter-spacing:-.045em;line-height:1;font-variation-settings:"wdth" 80;font-variant-numeric:tabular-nums}
.stats b small{font-size:14px;font-weight:500;opacity:.6;margin-left:1px}
.stats span{display:block;margin-top:5px;font-size:12px;color:var(--soft)}
.stats i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:8px}
.acts>*{all:unset;cursor:pointer;flex:1;text-align:center;padding:13px 0;border-radius:999px;font-size:14px;font-weight:620;letter-spacing:-.01em;transition:transform .18s}
.acts>*:active{transform:scale(.97)}
.acts .pri{background:var(--knob);color:var(--knob-fg)}
.acts .sec{background:var(--glass-hi);border:1px solid var(--edge)}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.02em}
.nb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nb button{all:unset;cursor:pointer;display:block;overflow:hidden;border-radius:12px;aspect-ratio:3/4;background:rgba(0,0,0,.2);transition:transform .2s}
.nb button:hover{transform:translateY(-3px) scale(1.04)}
.nb img{width:100%;height:100%;object-fit:cover;display:block}
/* ---------- loading ---------- */
.loading{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:24px}
.loading .box{width:min(520px,90vw)}
#ltxt{display:flex;flex-direction:column-reverse;gap:6px}
#ltxt span:first-child{font-size:16px;color:var(--soft)}
#ltxt span:last-child{font-size:clamp(84px,18vw,168px);font-weight:300;letter-spacing:-.07em;line-height:.85;font-variation-settings:"wdth" 75,"opsz" 96;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--faint);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--fg);transition:width .25s}
@media (max-width:980px){
  .top{flex-wrap:wrap;gap:10px}
  .brand{flex:1 1 100%;flex-direction:row;align-items:baseline;justify-content:space-between;padding:12px 18px}
  .brand h1{font-size:24px}
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{padding:9px 13px;font-size:14px}
  .spacer{display:none}
  .legend{display:none}
  .dock{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;padding:6px 6px 6px 16px;gap:10px}
  .dock .lab{display:none}
  .rng{flex:1;width:auto;min-width:90px}
  #zin,#zout,.sep{display:none}
  .rb{width:38px;height:38px}
  .panel{top:auto;left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:66%;border-radius:28px}
  .panel img.big{aspect-ratio:auto;max-height:34vh}
}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="top">
      <div class="brand glass"><h1>Media <i>Explorer</i></h1><a href="../asset-mariage/" title="Retour au bestiaire">Bestiaire du mariage · <b id="status"></b></a></div>
      <div class="seg glass" id="gLay"></div>
      <div class="spacer"></div>
      <div class="seg glass" id="gSec"></div>
    </div>
    <div class="legend glass" id="legend"></div>
    <div class="dock glass">
      <span class="lab" id="spcl">Espacement</span>
      <button class="rb" id="sless" type="button" aria-label="Rapprocher"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
      <div class="rng"><input id="spc" type="range" min="0.5" max="3" step="0.1" aria-labelledby="spcl"></div>
      <button class="rb" id="smore" type="button" aria-label="Espacer"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <output class="val" id="spco"></output>
      <span class="sep"></span>
      <button class="rb" id="zout" type="button" aria-label="Dézoomer"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button class="rb" id="zfit" type="button" aria-label="Tout voir"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
      <button class="rb" id="zin" type="button" aria-label="Zoomer"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <div class="tip glass" id="tip" hidden></div>
    <aside class="panel glass" id="panel" hidden>
      <div class="fig"><img class="big" id="pimg" alt=""><span class="code glass" id="pcode"></span><button class="close glass" id="pclose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="pb">
        <div><div class="n" id="pname"></div><div class="s" id="pser"></div></div>
        <div class="stats" id="pfeat"></div>
        <div class="acts"><a class="pri" id="phd" target="_blank" rel="noopener">Ouvrir en HD</a><button class="sec" id="pcenter" type="button">Centrer</button></div>
        <div><h3>Les plus proches</h3><div class="nb" id="pnb"></div></div>
      </div>
    </aside>
    <div class="loading" id="loading"><div class="box"><div id="ltxt"><span>Chargement des médias</span><span>0%</span></div><div class="bar"><i id="lbar"></i></div></div></div>
  </div>
<script src="umap-js.min.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
const LAYOUTS=[
  {k:'sim',t:'Ressemblance',d:'<b>Ressemblance</b>Les vignettes proches se ressemblent par la couleur, la lumière et la densité du dessin (projection UMAP).'},
  {k:'col',t:'Couleur',d:'<b>Couleur</b>Roue chromatique : l\'angle suit la teinte dominante, le centre réunit les images peu saturées.'},
  {k:'den',t:'Densité',d:'<b>Densité</b>De gauche à droite, du plus épuré au plus chargé ; de bas en haut, du plus sombre au plus clair.'},
  {k:'ser',t:'Série',d:'<b>Série</b>Une ligne par série, dans l\'ordre de la page.'}
];
const SECS=[{k:'all',t:'Tout'},{k:'menus',t:'Menus'},{k:'panneaux',t:'Panneaux'}];
const st={sec:'all',lay:'sim',sel:null,gap:1.4};
try{Object.assign(st,JSON.parse(localStorage.getItem('carte-st')||'{}'));st.sel=null}catch(e){}
const save=()=>{try{localStorage.setItem('carte-st',JSON.stringify({sec:st.sec,lay:st.lay,gap:st.gap}))}catch(e){}};

// ---------- data ----------
const html=await (await fetch('../asset-mariage/')).text();
const m=html.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
const DATA=JSON.parse(m[1].replace(/<\\\//g,'</'));
const SER={};DATA.series.forEach((s,i)=>SER[s.code]={...s,idx:i});
const thumb=(u,w)=>u.replace('https://assets.hint3rland.com/','https://assets.hint3rland.com/cdn-cgi/image/width='+w+',quality=80,format=jpeg/');
const N=DATA.items.map(it=>({it,ser:SER[it.s],sec:(SER[it.s]||{}).sec||'menus',img:null,ar:0.75,f:null,x:0,y:0,tx:0,ty:0,pos:{}}));

// ---------- image loading + features ----------
const CACHE_KEY='carte-feat-v1';
let cache={};try{cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')}catch(e){}
const fc=document.createElement('canvas'),fg=fc.getContext('2d',{willReadFrequently:true});
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [h,mx?d/mx:0,mx]}
function features(img){
  const W=48,H=Math.max(24,Math.round(48/img.naturalWidth*img.naturalHeight));
  fc.width=W;fc.height=H;fg.drawImage(img,0,0,W,H);
  const d=fg.getImageData(0,0,W,H).data,n=W*H;
  const hist=new Array(12).fill(0),grey=[0,0,0];let sL=0,sS=0,sx=0,sy=0,cw=0;const L=new Float32Array(n);
  for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const[h,s,v]=rgb2hsv(r,g,b);L[i]=(0.299*r+0.587*g+0.114*b)/255;sL+=L[i];sS+=s;
    if(s>0.18&&v>0.12){const w=s*v;hist[Math.floor(h/30)%12]+=w;const a=h*Math.PI/180;sx+=Math.cos(a)*w;sy+=Math.sin(a)*w;cw+=w}
    else grey[v<0.33?0:v<0.66?1:2]+=1}
  let e=0;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
    const gx=L[i+1]-L[i-1]+(L[i-W+1]-L[i-W-1]+L[i+W+1]-L[i+W-1])*0.5;const gy=L[i+W]-L[i-W]+(L[i+W+1]-L[i-W+1]+L[i+W-1]-L[i-W-1])*0.5;e+=Math.hypot(gx,gy)}
  e/=(W-2)*(H-2);
  const tot=hist.reduce((a,b)=>a+b,0)+grey.reduce((a,b)=>a+b,0)/3||1;
  const hue=cw?((Math.atan2(sy,sx)*180/Math.PI)+360)%360:0;
  return {hist:hist.map(v=>v/tot),grey:grey.map(v=>v/n),L:sL/n,S:sS/n,E:e,hue,sat:cw/n};
}
let loaded=0;
function load(nd){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.decoding='async';
  i.onload=()=>{nd.img=i;nd.ar=i.naturalWidth/i.naturalHeight;const k=nd.it.url;
    if(cache[k])nd.f=cache[k];else{try{nd.f=features(i);cache[k]=nd.f}catch(e){nd.f=null}}
    loaded++;$('#lbar').style.width=(100*loaded/N.length)+'%';$('#ltxt').innerHTML=`<span>Analyse des médias · ${loaded} sur ${N.length}</span><span>${Math.round(100*loaded/N.length)}%</span>`;res()};
  i.onerror=()=>{loaded++;res()};i.src=thumb(nd.it.url,160)})}
const queue=N.slice();await Promise.all(Array.from({length:12},async()=>{while(queue.length){await load(queue.shift())}}));
try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache))}catch(e){}
const OK=N.filter(n=>n.img&&n.f);{const es=OK.map(n=>n.f.E).sort((a,b)=>a-b);OK.forEach(n=>{n.eRank=es.indexOf(n.f.E)/(es.length-1||1)})}
OK.forEach(n=>{const f=n.f;n.vec=[...f.hist.map(v=>v*2.2),...f.grey.map(v=>v*1.2),f.L*1.6,f.S*1.4,Math.min(1,f.E*4)*1.8]});

// ---------- neighbours ----------
function dist(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return s}
OK.forEach(a=>{a.nb=OK.filter(b=>b!==a).map(b=>[dist(a.vec,b.vec),b]).sort((p,q)=>p[0]-q[0]).slice(0,8).map(p=>p[1])});

// ---------- layouts (world units, thumbnail width ~ 40) ----------
const TW=40;
function relax(list,key,iter){const P=list.map(n=>n.pos[key]);const R=TW*0.62;
  for(let k=0;k<iter;k++){const cell=R*2,grid=new Map();
    P.forEach((p,i)=>{const gx=Math.floor(p[0]/cell),gy=Math.floor(p[1]/cell),kk=gx+','+gy;(grid.get(kk)||grid.set(kk,[]).get(kk)).push(i)});
    P.forEach((p,i)=>{const gx=Math.floor(p[0]/cell),gy=Math.floor(p[1]/cell);
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const c=grid.get((gx+dx)+','+(gy+dy));if(!c)continue;
        for(const j of c){if(j<=i)continue;const q=P[j];let vx=q[0]-p[0],vy=q[1]-p[1];let dd=Math.hypot(vx,vy);
          if(dd<R*2){if(dd<0.01){vx=Math.random()-.5;vy=Math.random()-.5;dd=0.5}const push=(R*2-dd)/2/dd;p[0]-=vx*push;p[1]-=vy*push;q[0]+=vx*push;q[1]+=vy*push}}}})}}
function relaxBox(list,key,iter,k){const P=list.map(n=>n.pos[key]);const HW=TW/2*k;const HH=list.map(n=>TW/n.ar/2*k);const cell=Math.max(HW,...HH)*2.2;
  for(let it=0;it<iter;it++){const grid=new Map();let hit=0;
    P.forEach((p,i)=>{const kk=Math.floor(p[0]/cell)+','+Math.floor(p[1]/cell);(grid.get(kk)||grid.set(kk,[]).get(kk)).push(i)});
    P.forEach((p,i)=>{const gx=Math.floor(p[0]/cell),gy=Math.floor(p[1]/cell);
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const c=grid.get((gx+dx)+','+(gy+dy));if(!c)continue;
        for(const j of c){if(j<=i)continue;const q=P[j];let vx=q[0]-p[0],vy=q[1]-p[1];
          const ox=HW*2-Math.abs(vx),oy=HH[i]+HH[j]-Math.abs(vy);if(ox<=0||oy<=0)continue;hit++;
          if(Math.abs(vx)<1e-3&&Math.abs(vy)<1e-3){vx=Math.random()-.5;vy=Math.random()-.5}
          if(ox*TW/(HH[i]+HH[j])<oy){const m=ox/2*Math.sign(vx||1);p[0]-=m;q[0]+=m}else{const m=oy/2*Math.sign(vy||1);p[1]-=m;q[1]+=m}}}});
    if(!hit)break}}
function norm(list,key,span){const xs=list.map(n=>n.pos[key][0]),ys=list.map(n=>n.pos[key][1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  list.forEach(n=>{const p=n.pos[key];p[0]=(p[0]-x0)/((x1-x0)||1)*span;p[1]=(p[1]-y0)/((y1-y0)||1)*span})}
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const span=Math.sqrt(OK.length)*TW*1.15;
async function computeSim(){
  $('#ltxt').innerHTML='<span>Calcul des rapprochements</span><span>100%</span>';$('#lbar').style.width='100%';
  await new Promise(r=>setTimeout(r,30));
  const um=new UMAP.UMAP({nComponents:2,nNeighbors:12,minDist:0.25,spread:1.2,random:seeded(7)});
  const emb=await um.fitAsync(OK.map(n=>n.vec),()=>{});
  OK.forEach((n,i)=>n.pos.sim=[emb[i][0],emb[i][1]]);norm(OK,'sim',span);OK.forEach(n=>n.raw.sim=n.pos.sim.slice());
}
function computeCol(){OK.forEach(n=>{const f=n.f;const a=f.hue*Math.PI/180;const r=Math.min(1,f.sat*3.2);
  const rr=(0.12+0.88*r)*span*0.5;n.raw.col=[span/2+Math.cos(a)*rr,span/2-Math.sin(a)*rr]})}
function computeDen(){const es=OK.map(n=>n.f.E).sort((a,b)=>a-b),ls=OK.map(n=>n.f.L).sort((a,b)=>a-b);
  const rank=(arr,v)=>{let lo=0,hi=arr.length;while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<v)lo=mid+1;else hi=mid}return lo/arr.length};
  OK.forEach(n=>n.raw.den=[rank(es,n.f.E)*span*1.3,(1-rank(ls,n.f.L))*span])}
function computeSer(g){const rows={};OK.forEach(n=>{(rows[n.it.s]=rows[n.it.s]||[]).push(n)});
  const order=DATA.series.map(s=>s.code).filter(c=>rows[c]);
  let y=0;order.forEach(c=>{const L=rows[c];const rh=Math.max(...L.map(n=>TW/n.ar));const sx=TW*(0.08+g),sy=rh*(0.08+g);const lines=Math.ceil(L.length/30);
    L.forEach((n,i)=>{n.pos.ser=[(i%30)*sx,y+Math.floor(i/30)*sy]});SER[c].rowY=y;SER[c].rowH=rh;y+=(lines-1)*sy+rh+TW*0.9})}
// spacing: g < 1 tightens (overlap allowed), g > 1 spreads; collision boxes keep a 6 % margin
function applyLayout(key){const g=st.gap;
  if(key==='ser'){computeSer(g);return}
  const c=span/2;OK.forEach(n=>{const r=n.raw[key];n.pos[key]=[c+(r[0]-c)*g,c+(r[1]-c)*g]});relaxBox(OK,key,80,Math.min(1,g)*1.06)}
OK.forEach(n=>{n.raw={};n.pos={}});
await computeSim();computeCol();computeDen();LAYOUTS.forEach(l=>applyLayout(l.k));
$('#loading').hidden=true;

// ---------- view ----------
let view={x:0,y:0,s:1},anim=null;
function visible(){return OK.filter(n=>st.sec==='all'||n.sec===st.sec)}
function bounds(list){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;list.forEach(n=>{const p=n.pos[st.lay];x0=Math.min(x0,p[0]-TW);y0=Math.min(y0,p[1]-TW);x1=Math.max(x1,p[0]+TW);y1=Math.max(y1,p[1]+TW)});return[x0,y0,x1,y1]}
function fit(animate){const r=cv.getBoundingClientRect();const[x0,y0,x1,y1]=bounds(visible());const pad=36;
  const top=Math.min(r.height*0.4,document.querySelector('.top').getBoundingClientRect().bottom+18),bot=Math.max(r.height*0.6,document.querySelector('.dock').getBoundingClientRect().top-18);
  const s=Math.min((r.width-pad*2)/(x1-x0),(bot-top)/(y1-y0));const t={s,x:r.width/2-(x0+x1)/2*s,y:(top+bot)/2-(y0+y1)/2*s};
  if(animate)tweenView(t);else view=t}
function tweenView(t){const f={...view},t0=performance.now();anim=()=>{const k=Math.min(1,(performance.now()-t0)/450),e=1-Math.pow(1-k,3);
  view={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,s:f.s+(t.s-f.s)*e};if(k>=1)anim=null};}
function setTargets(){OK.forEach(n=>{const p=n.pos[st.lay];n.tx=p[0];n.ty=p[1]})}
OK.forEach(n=>{const p=n.pos[st.lay]||n.pos.sim;n.x=n.tx=p[0];n.y=n.ty=p[1]});
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*DPR;cv.height=r.height*DPR}
window.addEventListener('resize',()=>{resize()});resize();fit(false);

let hover=null;const css=getComputedStyle(document.documentElement);
// dot grid in world space, drawn through a repeating pattern (cheap at any zoom)
let dotPat=null,dotCol='';function dots(){const col=css.getPropertyValue('--dot').trim();let s=TW*view.s;while(s<16)s*=2;while(s>64)s/=2;
  if(!dotPat||dotCol!==col||dotPat.s!==Math.round(s*DPR)){const S=Math.max(4,Math.round(s*DPR));const oc=document.createElement('canvas');oc.width=oc.height=S;const o=oc.getContext('2d');
    o.fillStyle=col;const d=Math.max(1,Math.round(DPR));o.fillRect(0,0,d,d);dotPat=ctx.createPattern(oc,'repeat');dotPat.s=S;dotCol=col}
  const r=cv.getBoundingClientRect();const k=s/(dotPat.s/DPR);
  dotPat.setTransform(new DOMMatrix([1/DPR*k,0,0,1/DPR*k,((view.x%s)+s)%s,((view.y%s)+s)%s]));ctx.fillStyle=dotPat;ctx.fillRect(0,0,r.width,r.height)}
function draw(){
  if(anim)anim();
  let moving=false;OK.forEach(n=>{const dx=n.tx-n.x,dy=n.ty-n.y;if(Math.abs(dx)+Math.abs(dy)>0.3){n.x+=dx*0.14;n.y+=dy*0.14;moving=true}else{n.x=n.tx;n.y=n.ty}});
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.translate(view.x,view.y);ctx.scale(view.s,view.s);
  const vis=visible(),sel=st.sel;
  if(st.lay==='ser'){ctx.fillStyle=css.getPropertyValue('--soft');ctx.font=`650 13px 'Bricolage Grotesque', sans-serif`;
    DATA.series.forEach(s=>{if(s.rowY==null)return;if(st.sec!=='all'&&s.sec!==st.sec)return;ctx.fillText(s.code+'  '+s.title,-TW*0.5,s.rowY-s.rowH/2-TW*0.25)})}
  if(st.lay==='col'){ctx.strokeStyle=css.getPropertyValue('--faint');ctx.lineWidth=1/view.s;ctx.setLineDash([4/view.s,6/view.s]);ctx.beginPath();ctx.arc(span/2,span/2,span*0.5*st.gap,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
  if(sel){ctx.strokeStyle=css.getPropertyValue('--link');ctx.lineWidth=1/view.s;sel.nb.forEach(b=>{if(!vis.includes(b))return;ctx.beginPath();ctx.moveTo(sel.x,sel.y);ctx.lineTo(b.x,b.y);ctx.stroke()})}
  const dim=sel?new Set([sel,...sel.nb]):null;
  const vr=cv.getBoundingClientRect(),[vx0,vy0]=toWorld(-60,-60),[vx1,vy1]=toWorld(vr.width+60,vr.height+60);const rad=Math.min(TW*0.12,9/view.s);const round=TW*view.s>22;
  for(const n of vis){if(n.x<vx0||n.x>vx1||n.y<vy0||n.y>vy1)continue;const w=TW,h=TW/n.ar;ctx.globalAlpha=dim&&!dim.has(n)?0.18:1;
    if(round){ctx.save();ctx.beginPath();ctx.roundRect(n.x-w/2,n.y-h/2,w,h,rad);ctx.clip();ctx.drawImage(n.img,n.x-w/2,n.y-h/2,w,h);ctx.restore()}
    else ctx.drawImage(n.img,n.x-w/2,n.y-h/2,w,h)}
  ctx.globalAlpha=1;
  ctx.lineWidth=2.5/view.s;const o=4/view.s;
  [[hover,'--fg'],[sel,'--accent']].forEach(([n,c])=>{if(!n)return;const col=css.getPropertyValue(c);ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=18;const w=TW,h=TW/n.ar;
    ctx.beginPath();ctx.roundRect(n.x-w/2-o,n.y-h/2-o,w+2*o,h+2*o,rad+o);ctx.stroke();ctx.shadowBlur=0});
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- interaction ----------
function toWorld(cx,cy){return[(cx-view.x)/view.s,(cy-view.y)/view.s]}
function pick(cx,cy){const[wx,wy]=toWorld(cx,cy);const vis=visible();for(let i=vis.length-1;i>=0;i--){const n=vis[i],w=TW,h=TW/n.ar;
  if(wx>=n.x-w/2&&wx<=n.x+w/2&&wy>=n.y-h/2&&wy<=n.y+h/2)return n}return null}
function zoomAt(cx,cy,f){const s=Math.max(0.05,Math.min(12,view.s*f));const k=s/view.s;view={s,x:cx-(cx-view.x)*k,y:cy-(cy-view.y)*k}}
cv.addEventListener('wheel',e=>{e.preventDefault();anim=null;const r=cv.getBoundingClientRect();
  const cx=e.clientX-r.left,cy=e.clientY-r.top;
  if(e.ctrlKey||e.metaKey)zoomAt(cx,cy,Math.exp(-e.deltaY*0.01));
  else if(e.deltaMode===0&&(e.deltaX!==0||Math.abs(e.deltaY)<40)){view.x-=e.deltaX;view.y-=e.deltaY}
  else zoomAt(cx,cy,Math.exp(-Math.sign(e.deltaY)*0.18))},{passive:false});
const ptrs=new Map();let down=null,moved=false,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});anim=null;
  if(ptrs.size===1){down={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;cv.classList.add('drag')}
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s};down=null}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;zoomAt(cx,cy,(pinch.s*d/pinch.d)/view.s);moved=true;return}
  if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;view.x=down.vx+dx;view.y=down.vy+dy;$('#tip').hidden=true;return}
  const n=pick(e.clientX-r.left,e.clientY-r.top);hover=n;const tip=$('#tip');
  if(n&&e.pointerType==='mouse'){tip.hidden=false;tip.innerHTML=`<img alt="" src="${thumb(n.it.url,160)}"><div><b>${n.it.n}</b><span>${n.it.s} · ${(n.ser||{}).title||''}</span></div>`;tip.style.left=Math.min(e.clientX-r.left+18,r.width-310)+'px';tip.style.top=(e.clientY-r.top+18)+'px'}else tip.hidden=true});
cv.addEventListener('pointerup',e=>{const r=cv.getBoundingClientRect();ptrs.delete(e.pointerId);cv.classList.remove('drag');
  if(ptrs.size<2)pinch=null;if(down&&!moved){const n=pick(e.clientX-r.left,e.clientY-r.top);select(n)}down=null});
cv.addEventListener('pointerleave',()=>{hover=null;$('#tip').hidden=true});
$('#zin').onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.4)};
$('#zout').onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.4)};
$('#zfit').onclick=()=>fit(true);
function centerOn(n){const r=cv.getBoundingClientRect();const s=Math.max(view.s,2.2);tweenView({s,x:r.width/2-n.tx*s,y:r.height/2-n.ty*s})}
function pct(v){return Math.round(v*100)+' %'}
const HUE=['rouge','orangé','jaune','vert-jaune','vert','vert d\'eau','cyan','bleu ciel','bleu','violet','rose','rouge'];
function select(n){st.sel=n;const p=$('#panel');if(!n){p.hidden=true;return}p.hidden=false;
  $('#pimg').src=thumb(n.it.url,600);$('#pimg').alt=n.it.n;$('#pname').textContent=n.it.n;
  $('#pser').textContent=(n.ser||{}).title||'';$('#pcode').textContent=`${n.it.s} · ${n.it.num}`;
  const f=n.f;const top=f.hist.indexOf(Math.max(...f.hist));
  const hueCol=f.sat>0.02?`hsl(${Math.round(f.hue)} ${Math.round(Math.min(1,f.sat*3)*80+15)}% 55%)`:'#999';
  const pp=v=>`${Math.round(v*100)}<small>%</small>`;
  $('#pfeat').innerHTML=`<div><b>${f.sat>0.02?HUE[top]:'neutre'}</b><span><i style="background:${hueCol}"></i>Teinte dominante</span></div><div><b>${pp(Math.min(1,f.sat*3))}</b><span>Saturation</span></div><div><b>${pp(f.L)}</b><span>Lumière</span></div><div><b>${pp(n.eRank)}</b><span>Densité du dessin</span></div>`;
  $('#phd').href=n.it.url;
  const nb=$('#pnb');nb.innerHTML='';n.nb.forEach(b=>{const bt=document.createElement('button');bt.title=`${b.it.s} · ${b.it.n}`;
    bt.innerHTML=`<img alt="${b.it.s} ${b.it.n}" src="${thumb(b.it.url,160)}">`;bt.onclick=()=>{select(b);centerOn(b)};nb.append(bt)})}
$('#pclose').onclick=()=>select(null);$('#pcenter').onclick=()=>st.sel&&centerOn(st.sel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});

// ---------- controls ----------
function chip(t,on,pressed,count){const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-label',count!=null?t+' ('+count+')':t);if(count!=null){const s=document.createElement('sup');s.textContent=count;b.append(s)}b.setAttribute('aria-pressed',pressed);b.onclick=on;return b}
function moveInd(seg,anim){const b=seg.querySelector('[aria-pressed="true"]'),i=seg.querySelector('.ind');if(!b||!i)return;
  if(anim===false&&!i.dataset.on){i.style.transition='none';requestAnimationFrame(()=>i.style.transition='')}i.dataset.on=1;
  i.style.width=b.offsetWidth+'px';i.style.transform=`translateX(${b.offsetLeft}px)`}
window.addEventListener('resize',()=>{moveInd($('#gSec'));moveInd($('#gLay'))});document.fonts&&document.fonts.ready.then(()=>{moveInd($('#gSec'));moveInd($('#gLay'))});
function bar(){
  const gs=$('#gSec');gs.innerHTML='<span class="ind"></span>';
  SECS.forEach(s=>gs.append(chip(s.t,()=>{st.sec=s.k;save();bar();fit(true)},st.sec===s.k,OK.filter(n=>s.k==='all'||n.sec===s.k).length)));
  const gl=$('#gLay');gl.innerHTML='<span class="ind"></span>';
  LAYOUTS.forEach(l=>gl.append(chip(l.t,()=>{st.lay=l.k;save();setTargets();bar();setTimeout(()=>fit(true),40)},st.lay===l.k)));
  $('#legend').innerHTML=LAYOUTS.find(l=>l.k===st.lay).d+'<span class="hint">Clic pour voir les voisines · glisser pour se déplacer · molette pour zoomer</span>';
  $('#status').textContent=`${visible().length} médias`;requestAnimationFrame(()=>{moveInd(gs,false);moveInd(gl,false)});
}
const spc=$('#spc'),spo=$('#spco');let spT=null;
function showGap(){spo.innerHTML='<small>×</small>'+st.gap.toFixed(1).replace('.',',');spc.style.setProperty('--p',((st.gap-0.5)/2.5*100)+'%')}
function setGap(v,refit){st.gap=Math.round(Math.max(0.5,Math.min(3,v))*10)/10;spc.value=st.gap;showGap();save();
  clearTimeout(spT);spT=setTimeout(()=>{LAYOUTS.forEach(l=>applyLayout(l.k));setTargets();if(refit)fit(true)},60)}
spc.addEventListener('input',()=>setGap(+spc.value,false));spc.addEventListener('change',()=>fit(true));
$('#sless').onclick=()=>setGap(st.gap-0.2,true);$('#smore').onclick=()=>setGap(st.gap+0.2,true);
spc.value=st.gap;showGap();
setTargets();bar();fit(false);
})().catch(e=>{document.getElementById('ltxt').textContent='Erreur : '+e.message;console.error(e)});
</script>
</body>
</html>
