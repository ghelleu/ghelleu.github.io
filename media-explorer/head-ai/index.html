<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Media Explorer · HEAD Architecture d'intérieur</title>
<meta name="description" content="Cartographie visuelle des projets de la filière architecture d'intérieur de la HEAD – Genève, Bachelor et Master, à partir des sources publiques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<style>
/* Media Explorer · dark-first, glass UI floating over a full-bleed map */
:root{
  --bg:#08080a; --glow1:rgba(86,0,2,.55); --glow2:rgba(166,200,255,.16); --glow3:rgba(59,51,2,.35);
  --fg:#f6f3ee; --soft:rgba(246,243,238,.62); --faint:rgba(246,243,238,.32);
  --glass:rgba(28,26,30,.46); --glass-hi:rgba(255,255,255,.10); --edge:rgba(255,255,255,.14); --edge-top:rgba(255,255,255,.28);
  --knob:#ffffff; --knob-fg:#0c0b0d; --accent:#a6c8ff; --accent-2:#ff8f86; --link:rgba(166,200,255,.55);
  --shadow:0 18px 50px -12px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.35);
  --ui:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:22px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e9e6e1; --glow1:rgba(166,200,255,.55); --glow2:rgba(242,233,215,.9); --glow3:rgba(255,143,134,.22);
  --fg:#141216; --soft:rgba(20,18,22,.62); --faint:rgba(20,18,22,.32);
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.65); --edge:rgba(20,18,22,.08); --edge-top:rgba(255,255,255,.9);
  --knob:#141216; --knob-fg:#ffffff; --accent:#1d4fd7; --accent-2:#b0261d; --link:rgba(29,79,215,.5);
  --shadow:0 18px 50px -14px rgba(40,30,20,.28),0 2px 6px rgba(40,30,20,.08); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#e9e6e1; --glow1:rgba(166,200,255,.55); --glow2:rgba(242,233,215,.9); --glow3:rgba(255,143,134,.22);
  --fg:#141216; --soft:rgba(20,18,22,.62); --faint:rgba(20,18,22,.32);
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.65); --edge:rgba(20,18,22,.08); --edge-top:rgba(255,255,255,.9);
  --knob:#141216; --knob-fg:#ffffff; --accent:#1d4fd7; --accent-2:#b0261d; --link:rgba(29,79,215,.5);
  --shadow:0 18px 50px -14px rgba(40,30,20,.28),0 2px 6px rgba(40,30,20,.08); color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60vmax 50vmax at 12% 8%,var(--glow1),transparent 60%),radial-gradient(55vmax 45vmax at 92% 88%,var(--glow2),transparent 60%),radial-gradient(40vmax 40vmax at 70% 10%,var(--glow3),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),var(--shadow);border-radius:var(--r)}
.stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
/* ---------- top layer ---------- */
.top{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:14px;pointer-events:none;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.top>*{pointer-events:auto}
.brand{padding:14px 22px 15px 20px;display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-weight:760;font-size:30px;letter-spacing:-.045em;line-height:.95;font-variation-settings:"wdth" 82,"opsz" 96}
.brand h1 i{font-style:normal;font-weight:300;letter-spacing:-.03em}
.brand a{color:inherit;text-decoration:none;font-size:13px;color:var(--soft);font-variation-settings:"opsz" 14}
.brand a:hover{color:var(--fg)}
.brand a b{font-weight:650;color:var(--fg);font-variant-numeric:tabular-nums}
.seg{position:relative;display:flex;padding:5px;gap:2px;border-radius:999px}
.seg .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--knob);box-shadow:0 6px 18px -6px rgba(0,0,0,.5);
  transition:transform .42s cubic-bezier(.3,1.35,.45,1),width .42s cubic-bezier(.3,1.35,.45,1);z-index:0}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;padding:10px 17px;border-radius:999px;font-size:15px;font-weight:520;letter-spacing:-.01em;color:var(--soft);
  white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .25s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{color:var(--knob-fg)}
.seg button:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.seg sup{font-size:11px;font-weight:600;line-height:1;top:0;padding:3px 6px;border-radius:999px;background:var(--glass-hi);color:inherit;opacity:.8}
.seg button[aria-pressed="true"] sup{background:rgba(128,128,128,.18)}
.spacer{flex:1}
.seg:empty,.legend:empty{display:none}
/* ---------- dock ---------- */
.dock{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;padding:8px 8px 8px 22px;border-radius:999px}
.dock .lab{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--soft);white-space:nowrap}
.rng{position:relative;width:220px;height:30px;display:flex;align-items:center}
.rng input{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;position:relative;z-index:1}
.rng input::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--fg) 0 var(--p,30%),var(--faint) var(--p,30%) 100%)}
.rng input::-moz-range-track{height:8px;border-radius:99px;background:var(--faint)}
.rng input::-moz-range-progress{height:8px;border-radius:99px;background:var(--fg)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--knob);border:3px solid var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s}
.rng input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--knob);border:3px solid var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.rng input:active::-webkit-slider-thumb{transform:scale(1.18)}
.rng input:focus-visible{outline:none}
.rng input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--link)}
.val{min-width:52px;font-size:22px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 80}
.val small{font-size:13px;font-weight:500;opacity:.55;margin-right:1px}
.rb{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass-hi);border:1px solid var(--edge);transition:transform .18s,background .2s}
.rb:hover{transform:scale(1.07);background:var(--knob);color:var(--knob-fg)}
.rb:active{transform:scale(.95)}
.rb svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--edge)}
/* ---------- caption ---------- */
.legend{position:absolute;z-index:2;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:300px;padding:16px 18px;font-size:13px;line-height:1.45;color:var(--soft)}
.legend b{display:block;font-size:20px;font-weight:700;letter-spacing:-.035em;color:var(--fg);margin-bottom:4px;font-variation-settings:"wdth" 85}
.legend .hint{display:block;margin-top:8px;font-size:12px;color:var(--faint)}
/* ---------- tooltip ---------- */
.tip{position:absolute;z-index:4;pointer-events:none;display:flex;gap:10px;align-items:center;padding:7px 14px 7px 7px;border-radius:16px;max-width:300px}
.tip img{width:40px;height:52px;object-fit:cover;border-radius:9px;display:block}
.tip b{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;color:var(--fg)}
.tip span{display:block;font-size:12px;color:var(--soft)}
/* ---------- panel ---------- */
.panel{position:absolute;z-index:4;top:calc(104px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:360px;
  border-radius:30px;overflow:auto;display:flex;flex-direction:column;padding:10px;scrollbar-width:none;animation:pin .45s cubic-bezier(.2,1.2,.4,1)}
.panel::-webkit-scrollbar{display:none}
@keyframes pin{from{opacity:0;transform:translateX(24px) scale(.97)}}
.panel .fig{position:relative;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.25);flex:none}
.panel img.big{width:100%;aspect-ratio:4/5;object-fit:contain;display:block}
.panel .code{position:absolute;left:12px;top:12px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:650;letter-spacing:.01em}
.close{all:unset;cursor:pointer;position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.close:hover{background:var(--knob);color:var(--knob-fg)}
.panel .pb{padding:18px 10px 8px;display:flex;flex-direction:column;gap:18px}
.panel .n{font-size:34px;font-weight:760;line-height:.98;letter-spacing:-.05em;font-variation-settings:"wdth" 82,"opsz" 96}
.panel .s{font-size:14px;color:var(--soft);margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{padding:12px 14px;border-radius:16px;background:var(--glass-hi);border:1px solid var(--edge)}
.stats b{display:block;font-size:26px;font-weight:720;letter-spacing:-.045em;line-height:1;font-variation-settings:"wdth" 80;font-variant-numeric:tabular-nums}
.stats b small{font-size:14px;font-weight:500;opacity:.6;margin-left:1px}
.stats span{display:block;margin-top:5px;font-size:12px;color:var(--soft)}
.stats i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:8px}
.acts>*{all:unset;cursor:pointer;flex:1;text-align:center;padding:13px 0;border-radius:999px;font-size:14px;font-weight:620;letter-spacing:-.01em;transition:transform .18s}
.acts>*:active{transform:scale(.97)}
.acts .pri{background:var(--knob);color:var(--knob-fg)}
.acts .sec{background:var(--glass-hi);border:1px solid var(--edge)}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.02em}
.nb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nb button{all:unset;cursor:pointer;display:block;overflow:hidden;border-radius:12px;aspect-ratio:3/4;background:rgba(0,0,0,.2);transition:transform .2s}
.nb button:hover{transform:translateY(-3px) scale(1.04)}
.nb img{width:100%;height:100%;object-fit:cover;display:block}
/* ---------- loading ---------- */
.loading{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:24px}
.loading .box{width:min(520px,90vw)}
#ltxt{display:flex;flex-direction:column-reverse;gap:6px}
#ltxt span:first-child{font-size:16px;color:var(--soft)}
#ltxt span:last-child{font-size:clamp(84px,18vw,168px);font-weight:300;letter-spacing:-.07em;line-height:.85;font-variation-settings:"wdth" 75,"opsz" 96;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--faint);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--fg);transition:width .25s}
@media (max-width:980px){
  .top{flex-wrap:wrap;gap:10px}
  .brand{flex:1 1 100%;flex-direction:row;align-items:baseline;justify-content:space-between;padding:12px 18px}
  .brand h1{font-size:24px}
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{padding:9px 13px;font-size:14px}
  .spacer{display:none}
  .legend{display:none}
  .dock{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;padding:6px 6px 6px 16px;gap:10px}
  .dock .lab{display:none}
  .rng{flex:1;width:auto;min-width:90px}
  #zin,#zout,.sep{display:none}
  .rb{width:38px;height:38px}
  .panel{top:auto;left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:66%;border-radius:28px}
  .panel img.big{aspect-ratio:auto;max-height:34vh}
}
/* ---------- v2 additions ---------- */
.brand .sl{font-size:13px;color:var(--soft);font-variation-settings:"opsz" 14}
.brand .sl b{font-weight:650;color:var(--fg);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;padding:5px;border-radius:999px;align-items:center}
.pills button{all:unset;cursor:pointer;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:540;letter-spacing:-.01em;color:var(--soft);white-space:nowrap;display:flex;align-items:center;gap:8px;
  border:1px solid transparent;transition:color .2s,background .25s,border-color .25s}
.pills button:hover{color:var(--fg)}
.pills button[aria-pressed="true"]{color:var(--fg);background:var(--glass-hi);border-color:var(--edge-top)}
.pills button .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;transition:background .2s}
.pills button[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.pills button sup{font-size:11px;font-weight:600;line-height:1;top:0;opacity:.6}
.pills button:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.dock .grp{display:flex;align-items:center;gap:14px}
.zipb{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 18px 0 14px;height:42px;border-radius:999px;background:var(--knob);color:var(--knob-fg);font-size:14px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;transition:transform .18s}
.zipb:hover{transform:scale(1.03)}.zipb:active{transform:scale(.97)}
.zipb svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.zipb[disabled]{opacity:.6;cursor:progress}
.zipb b{font-weight:800;font-variant-numeric:tabular-nums}
/* grid (séries) view */
.gridv{position:absolute;inset:0;z-index:2;overflow:auto;scrollbar-width:thin;
  padding:calc(118px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 130px max(24px,env(safe-area-inset-left,0px))}
.coll{margin:0 auto 64px;max-width:1500px}
.coll>h2{margin:0 0 6px;font-size:clamp(44px,7vw,92px);font-weight:780;letter-spacing:-.06em;line-height:.9;font-variation-settings:"wdth" 78,"opsz" 96}
.coll>h2 i{font-style:normal;font-weight:300}
.coll>p{margin:0 0 34px;max-width:620px;color:var(--soft);font-size:15px}
.ser{margin:0 0 40px}
.ser header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ser .code{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--glass-hi);border:1px solid var(--edge)}
.ser h3{margin:0;font-size:26px;font-weight:720;letter-spacing:-.04em;line-height:1;font-variation-settings:"wdth" 85}
.ser .sub{flex:1 1 280px;color:var(--soft);font-size:13px}
.ser .sdl{all:unset;cursor:pointer;font-size:13px;font-weight:620;padding:8px 14px;border-radius:999px;background:var(--glass-hi);border:1px solid var(--edge)}
.ser .sdl:hover{background:var(--knob);color:var(--knob-fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,150px),1fr));gap:12px}
.card{position:relative;border-radius:16px;overflow:hidden;background:rgba(128,128,128,.12);aspect-ratio:var(--ratio,3/4);cursor:pointer;
  transition:transform .3s cubic-bezier(.2,1.2,.4,1),box-shadow .3s;outline:none}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow)}
.card:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{position:absolute;left:8px;right:8px;bottom:8px;padding:8px 10px;border-radius:12px;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none}
.card:hover .cap,.card:focus-visible .cap{opacity:1;transform:none}
.card .cap b{display:block;font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap span{display:block;font-size:11px;color:var(--soft)}
.card .fv{all:unset;cursor:pointer;position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.card:hover .fv,.card .fv[aria-pressed="true"]{opacity:1}
.fv svg,.ab svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linejoin:round}
.fv[aria-pressed="true"] svg,.ab[aria-pressed="true"] svg{fill:var(--accent-2);stroke:var(--accent-2)}
.empty{color:var(--soft);font-size:18px;text-align:center;margin-top:20vh}
/* panel extras */
.tagp{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:620;background:var(--glass-hi);border:1px solid var(--edge)}
.tagp:hover{background:var(--knob);color:var(--knob-fg)}
.tagp small{font-weight:500;opacity:.6}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border-radius:999px;font-size:14px;font-weight:620;background:var(--glass-hi);border:1px solid var(--edge);transition:transform .18s}
.ab:active{transform:scale(.97)}
.ab.pri{background:var(--knob);color:var(--knob-fg);border-color:transparent}
.prompt{font-size:13px;line-height:1.5;color:var(--soft);padding:12px 14px;border-radius:16px;background:var(--glass-hi);border:1px solid var(--edge);max-height:180px;overflow:auto}
.prompt:empty{display:none}
.navp{display:flex;gap:8px;position:absolute;right:56px;top:12px}
.navp button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.navp button:hover{background:var(--knob);color:var(--knob-fg)}
.navp svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
body.isgrid canvas,body.isgrid .legend,body.isgrid .dock .mapc{display:none}
body.isgrid .dock{padding:6px}
@media (max-width:980px){
  .pills{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .pills button{padding:9px 13px;font-size:14px}
  .gridv{padding-top:calc(206px + env(safe-area-inset-top,0px));padding-left:14px;padding-right:14px}
  .cards{--cw:110px;gap:8px}
  body:not(.isgrid) .zipb{display:none}
  body.isgrid .dock{left:50%;right:auto;transform:translateX(-50%)}
  .dock .grp{gap:10px}
}


/* ---------- HEAD space ---------- */
:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}}
:root[data-theme="light"]{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
.spaces{display:flex;gap:10px;font-size:13px;color:var(--soft);font-variation-settings:"opsz" 14;margin-top:4px}
.spaces a{color:var(--soft);text-decoration:none}
.spaces a:hover{color:var(--fg)}
.spaces a[aria-current]{color:var(--fg);font-weight:650}
.tools{display:flex;gap:6px;padding:5px;border-radius:999px}
.tools button{all:unset;cursor:pointer;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:560;color:var(--soft);display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid transparent}
.tools button:hover{color:var(--fg)}
.tools button[aria-pressed="true"]{color:var(--knob-fg);background:var(--knob)}

.side{position:absolute;z-index:4;left:max(18px,env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:400px;
  border-radius:30px;display:flex;flex-direction:column;overflow:hidden;animation:pinl .45s cubic-bezier(.2,1.2,.4,1)}

.dual{position:relative;flex:1;height:30px}

.strip canvas{display:block;width:100%;border-radius:10px;position:static;cursor:pointer;touch-action:auto}

/* grid of projects */
.gridv{position:absolute;inset:0;z-index:1;overflow:auto;padding:calc(130px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 120px max(24px,env(safe-area-inset-left,0px))}

  .brand{flex-wrap:wrap;row-gap:4px}

  .tools button{padding:9px 12px;font-size:14px}

}

<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="gridv" id="grid" hidden></div>
  <div class="top">
    <div class="brand glass"><h1>Media <i>Explorer</i></h1><span class="sl"><b id="status"></b></span>
      <nav class="spaces" aria-label="Espaces"><a href="../">Mariage</a><a href="./" aria-current="page">HEAD · Architecture d'intérieur</a></nav></div>
    <div class="seg glass" id="gLay" role="group" aria-label="Organisation"></div>
    <div class="spacer"></div>
    <div class="tools glass"><button type="button" id="bF" aria-pressed="false">Filtres <b id="nf"></b></button><button type="button" id="bA" aria-pressed="false">Analyse</button></div>
  </div>
  <aside class="side glass" id="side" hidden data-tab="f" aria-label="Filtres et analyse">
    <div class="sh"><h2 id="stitle">Filtres</h2><button class="close" id="sclose" type="button" aria-label="Fermer" style="position:static"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sb" id="sbody"></div>
  </aside>
  <div class="legend glass" id="legend"></div>
  <div class="dock glass">
    <div class="grp mapc">
      <span class="lab" id="spcl">Attraction</span>
      <button class="rb" id="sless" type="button" aria-label="Disperser"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <div class="rng"><input id="spc" type="range" min="0" max="100" step="1" aria-labelledby="spcl"></div>
      <button class="rb" id="smore" type="button" aria-label="Resserrer"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
      <output class="val" id="spco"></output>
      <span class="sep"></span>
      <button class="rb" id="zout" type="button" aria-label="Dézoomer"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button class="rb" id="zfit" type="button" aria-label="Tout voir"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
      <button class="rb" id="zin" type="button" aria-label="Zoomer"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
  </div>
  <div class="tip glass" id="tip" hidden></div>
  <div class="vtip glass" id="vtip" hidden></div>
  <aside class="panel glass" id="panel" hidden>
    <div class="fig"><img class="big" id="pimg" alt=""><button class="close glass" id="pclose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pb" id="pbody"></div>
  </aside>
  <div class="loading" id="loading"><div class="box"><div id="ltxt"><span>Chargement de la cartographie</span><span>…</span></div><div class="bar"><i style="width:60%"></i></div></div></div>
</div>
<script>
(async function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cv=$('#cv'),ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
const css=getComputedStyle(document.documentElement);
const LAYOUTS=[
  {k:'sim',t:'Ressemblance',d:'<b>Ressemblance</b>Chaque image est placée par une lecture de son contenu (modèle CLIP) : sujet, matière, cadrage et style. Les images proches se ressemblent.'},
  {k:'typ',t:'Type d\'image',d:'<b>Type d\'image</b>Les images s\'attirent par type de document (maquette, plan, rendu, photo d\'exposition…), puis par ressemblance. Types estimés automatiquement.'},
  {k:'chr',t:'Chronologie',d:'<b>Chronologie</b>Une colonne par année. Dans chaque colonne, la même carte de ressemblance : une même zone désigne le même genre d\'image d\'une année à l\'autre.'},
  {k:'col',t:'Couleur',d:'<b>Couleur</b>Roue chromatique : l\'angle suit la teinte dominante, le centre réunit les images peu saturées.'},
  {k:'lum',t:'Lumière',d:'<b>Lumière</b>De gauche à droite, du plus épuré au plus chargé ; de bas en haut, du plus sombre au plus clair.'},
  {k:'grid',t:'Projets',d:''}
];
// eight chart families folded from the thirteen image types (categorical slots in fixed order)
const FAM=[['Maquette',[0]],['Dessin technique',[1,2,3]],['Rendu 3D',[4]],['Collage, croquis, document',[5,6,12]],['Intérieur photographié',[7]],['Exposition',[8]],['Objet et matériaux',[9,10]],['Personnes et atelier',[11]]];
const famOf=[];FAM.forEach(([,l],f)=>l.forEach(c=>famOf[c]=f));
const SCOL=k=>css.getPropertyValue('--s'+(k+1)).trim();

// ---------- data ----------
const D=await (await fetch('data.json',{cache:'no-cache'})).json();
const I=D.it,NI=I.h.length,PR=D.proj,PE=D.people;
const years=[...new Set(PR.map(p=>p.y).filter(Boolean))].sort((a,b)=>a-b);
const Y0=years[0],Y1=years[years.length-1];
const atlas=[];
await Promise.all(Array.from({length:D.sheets},(_,k)=>new Promise(r=>{const im=new Image();im.onload=()=>{atlas[k]=im;r()};im.onerror=r;im.src='atlas_'+k+'.webp'})));
const url=(i,lv)=>D.cdn+I.h[i]+'/'+lv+'.webp';
const orig=i=>D.cdn+I.h[i]+'/o.'+I.ext[i];
// people roles per item, and per person
const roleOf=(p,pid)=>PR[p].stu.includes(pid)?'étudiant·e':PR[p].tea.includes(pid)?'encadrement':PR[p].ass.includes(pid)?'assistanat':(PR[p].oth||[]).includes(pid)?'autre':(PR[p].men||[]).includes(pid)?'cité·e':'';
const projPeople=p=>[...PR[p].stu,...PR[p].tea,...PR[p].ass,...(PR[p].oth||[]),...(PR[p].men||[])];
const pprojs=PE.map(()=>[]);PR.forEach((p,k)=>new Set(projPeople(k)).forEach(x=>pprojs[x].push(k)));
const N=[];for(let i=0;i<NI;i++){const a=I.atl[i];N.push({i,p:I.p[i],ar:I.w[i]/I.hh[i],a,x:0,y:0,tx:0,ty:0,pos:{},raw:{},lod:{}})}
const itemsOfProj=PR.map(()=>[]);N.forEach(n=>itemsOfProj[n.p].push(n));

// ---------- state ----------
const st={lay:'sim',att:40,sel:null,f:{y0:Y0,y1:Y1,lv:new Set(),ty:new Set(),src:new Set(),dc:new Set(),fc:new Set(),prize:false,dup:true,person:null,proj:null}};
try{const s=JSON.parse(localStorage.getItem('mx-head-st')||'{}');if(s.lay)st.lay=s.lay;if(Number.isFinite(s.att))st.att=s.att}catch(e){}
const H=location.hash.slice(1);if(LAYOUTS.some(l=>l.k===H))st.lay=H;if(H==='projets')st.lay='grid';
const save=()=>{try{localStorage.setItem('mx-head-st',JSON.stringify({lay:st.lay,att:st.att}))}catch(e){}};

// ---------- layouts ----------
const TW=40;const span=Math.sqrt(NI)*TW*1.15;
N.forEach(n=>{const i=n.i;n.raw.sim=[I.sim[i][0]*span,I.sim[i][1]*span];n.raw.typ=[I.typ[i][0]*span,I.typ[i][1]*span];
  const a=I.hue[i]*Math.PI/180,r=Math.min(1,I.sat[i]*3.2),rr=(0.12+0.88*r)*span*0.5;n.raw.col=[span/2+Math.cos(a)*rr,span/2-Math.sin(a)*rr]});
{const es=N.map(n=>I.E[n.i]).sort((a,b)=>a-b),ls=N.map(n=>I.L[n.i]).sort((a,b)=>a-b);
 const rank=(arr,v)=>{let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<v)lo=m+1;else hi=m}return lo/arr.length};
 N.forEach(n=>n.raw.lum=[rank(es,I.E[n.i])*span*1.3,(1-rank(ls,I.L[n.i]))*span])}
// chronology: one column per year; size each column from its own image count
const perYear={};N.forEach(n=>{const y=PR[n.p].y||Y0;(perYear[y]=perYear[y]||[]).push(n)});
const COLS=[];{let x=0;years.forEach(y=>{const L=perYear[y]||[];const w=Math.max(TW*6,Math.sqrt(L.length)*TW*1.2);COLS.push({y,x,w,n:L.length});
  L.forEach(n=>{n.raw.chr=[x+I.sim[n.i][0]*w,I.sim[n.i][1]*w*1.1];n.grp=y});x+=w+TW*5})}
function relax(list,key,k,iter){if(k<0.03)return;const P=list.map(n=>n.pos[key]);const R=list.map(n=>k*(TW*0.5+TW/n.ar*0.5)*0.5*1.04);const cell=Math.max(...R)*2;
  for(let it=0;it<iter;it++){const grid=new Map();let hit=0;
    P.forEach((p,i)=>{const kk=Math.floor(p[0]/cell)+','+Math.floor(p[1]/cell);(grid.get(kk)||grid.set(kk,[]).get(kk)).push(i)});
    P.forEach((p,i)=>{const gx=Math.floor(p[0]/cell),gy=Math.floor(p[1]/cell);
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const c=grid.get((gx+dx)+','+(gy+dy));if(!c)continue;
        for(const j of c){if(j<=i)continue;const q=P[j];let vx=q[0]-p[0],vy=q[1]-p[1];let d=Math.hypot(vx,vy);const m=R[i]+R[j];if(d>=m)continue;hit++;
          if(d<1e-3){const a=(i*2.399)%(Math.PI*2);vx=Math.cos(a);vy=Math.sin(a);d=1}
          const f=(m-d)/d*0.5*0.7;p[0]-=vx*f;p[1]-=vy*f;q[0]+=vx*f;q[1]+=vy*f}}});
    if(!hit)return}}
const scaleOf=a=>Math.exp(Math.log(3.2)*(1-a)+Math.log(0.32)*a);
const tolOf=a=>Math.max(0,Math.min(1,1-a*1.15));
const built={};
function applyLayout(key){if(key==='grid')return;const a=st.att/100,S=scaleOf(a);
  if(key==='chr'){// scale inside each year column, columns keep their order and spacing grows with the spread
    let off=0;COLS.forEach(c=>{const L=perYear[c.y]||[];const cx=c.x+c.w/2;let cy=0;L.forEach(n=>cy+=n.raw.chr[1]);cy/=L.length||1;
      L.forEach(n=>{n.pos.chr=[off+c.w*S/2+(n.raw.chr[0]-cx)*S,cy+(n.raw.chr[1]-cy)*S]});c.ox=off;c.ow=c.w*S;off+=c.w*S+TW*5})}
  else{let cx=0,cy=0;N.forEach(n=>{cx+=n.raw[key][0];cy+=n.raw[key][1]});cx/=NI;cy/=NI;
    N.forEach(n=>{const r=n.raw[key];n.pos[key]=[cx+(r[0]-cx)*S,cy+(r[1]-cy)*S]})}
  relax(N,key,tolOf(a),40);built[key]=st.att}
const ensure=k=>{if(k!=='grid'&&built[k]!==st.att)applyLayout(k)};
['sim'].forEach(applyLayout);

// ---------- filtering ----------
const F=st.f;
function pass(n,skip){const p=PR[n.p],i=n.i;
  if(skip!=='y'&&p.y&&(p.y<F.y0||p.y>F.y1))return false;
  if(F.dup&&I.dup[i]>=0)return false;
  if(skip!=='lv'&&F.lv.size&&!F.lv.has(p.lv==='BA+MA'?(F.lv.has('BA')?'BA':'MA'):p.lv))return false;
  if(skip!=='ty'&&F.ty.size&&!F.ty.has(p.ty))return false;
  if(skip!=='src'&&F.src.size&&!F.src.has(p.src))return false;
  if(skip!=='dc'&&F.dc.size&&!F.dc.has(I.dc[i]))return false;
  if(skip!=='fc'&&F.fc.size&&!F.fc.has(I.fc[i]))return false;
  if(F.prize&&!p.prz.length)return false;
  if(F.person!=null&&!projPeople(n.p).includes(F.person)&&!I.au[i].includes(F.person))return false;
  if(F.proj!=null&&n.p!==F.proj&&!I.also[i].includes(F.proj))return false;
  return true}
let VIS=[];const visSet=new Set();
function refresh(){VIS=N.filter(n=>pass(n));visSet.clear();VIS.forEach(n=>visSet.add(n));anchDirty=true;
  $('#status').textContent=VIS.length.toLocaleString('fr-CH')+' images';
  const nf=(F.y0!==Y0||F.y1!==Y1)+F.lv.size+F.ty.size+F.src.size+F.dc.size+F.fc.size+F.prize+(F.person!=null)+(F.proj!=null);$('#nf').textContent=nf||'';
  if(st.lay==='grid')renderGrid();if(!$('#side').hidden)renderSide()}

// ---------- view ----------
let view={x:0,y:0,s:1},anim=null;
function bounds(list){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;list.forEach(n=>{const p=n.pos[st.lay];x0=Math.min(x0,p[0]-TW);y0=Math.min(y0,p[1]-TW*1.6);x1=Math.max(x1,p[0]+TW);y1=Math.max(y1,p[1]+TW)});return[x0,y0,x1,y1]}
function fit(animate){if(st.lay==='grid'||!VIS.length)return;const r=cv.getBoundingClientRect();const[x0,y0,x1,y1]=bounds(VIS);const pad=36;
  const left=$('#side').hidden||innerWidth<980?pad:$('#side').getBoundingClientRect().right+18;
  const top=Math.min(r.height*0.4,$('.top').getBoundingClientRect().bottom+(st.lay==='chr'?44:18)),bot=Math.max(r.height*0.6,$('.dock').getBoundingClientRect().top-18);
  const s=Math.min((r.width-left-pad)/(x1-x0),(bot-top)/(y1-y0));const t={s,x:(left+r.width-pad)/2-(x0+x1)/2*s,y:(top+bot)/2-(y0+y1)/2*s};
  if(animate)tweenView(t);else view=t}
function tweenView(t){const f={...view},t0=performance.now();anim=()=>{const k=Math.min(1,(performance.now()-t0)/450),e=1-Math.pow(1-k,3);
  view={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,s:f.s+(t.s-f.s)*e};if(k>=1)anim=null}}
function setTargets(){anchDirty=true;if(st.lay==='grid')return;N.forEach(n=>{const p=n.pos[st.lay];n.tx=p[0];n.ty=p[1]})}

  VIS.forEach(n=>{const p=PR[n.p];const r=byY[p.y];if(r){r.t++;r.fam[famOf[I.dc[n.i]]]=(r.fam[famOf[I.dc[n.i]]]||0)+1;r.fc[I.fc[n.i]]=(r.fc[I.fc[n.i]]||0)+1;r.n.push(n)}projs.add(n.p)});
  projs.forEach(k=>new Set(projPeople(k)).forEach(x=>ppl.set(x,(ppl.get(x)||0)+1)));
  const famRows=ys.map(y=>({y,t:byY[y].t,c:byY[y].fam})),fcRows=ys.map(y=>({y,t:byY[y].t,c:byY[y].fc}));
  const top=[...ppl.entries()].sort((a,c)=>c[1]-a[1]).slice(0,14);
  b.innerHTML=`<div class="kpi"><div><b>${VIS.length.toLocaleString('fr-CH')}</b><span>images</span></div><div><b>${projs.size}</b><span>projets</span></div><div><b>${ppl.size}</b><span>personnes</span></div></div>
   <div class="fs chart" id="c1"><h4>Types d'image par année <span>part, estimée</span></h4>${stackChart(famRows,FAM.map((_,k)=>k),k=>SCOL(k),"Part de chaque type d'image par année")}
     <div class="lg">${FAM.map(([t],k)=>`<span><i style="background:${SCOL(k)}"></i>${esc(t)}</span>`).join('')}</div></div>
   <div class="fs chart" id="c2"><h4>Cadrages par année <span>part, estimée</span></h4>${stackChart(fcRows,D.frame.map((_,k)=>k),k=>SCOL(k),'Part de chaque cadrage par année')}
     <div class="lg">${D.frame.map((t,k)=>`<span><i style="background:${SCOL(k)}"></i>${esc(t)}</span>`).join('')}</div></div>
   <div class="fs strip"><h4>Couleurs dominantes par année <span>triées par teinte</span></h4><canvas id="cs" width="712" height="${ys.length*22}" style="height:${ys.length*11}px" aria-label="Couleurs dominantes par année"></canvas></div>
   <div class="fs"><h4>Personnes les plus présentes <span>projets</span></h4><div class="ppl">${top.map(([k,v])=>{const roles=new Set();pprojs[k].forEach(p=>{if(projs.has(p))roles.add(roleOf(p,k))});
     const yy=pprojs[k].map(p=>PR[p].y).filter(Boolean);return`<button type="button" data-person="${k}">${esc(PE[k])}<span>${v}</span><small>${[...roles].join(', ')} · ${Math.min(...yy)}${Math.max(...yy)!==Math.min(...yy)?' – '+Math.max(...yy):''}</small></button>`}).join('')}</div></div>
   <p class="note">Les graphiques suivent les filtres. Clic sur une barre : n'afficher que cette année. Clic sur une personne : ses projets.</p>`;
  const tip=$('#vtip');
  [['#c1',famRows,FAM.map(f=>f[0])],['#c2',fcRows,D.frame]].forEach(([id,rows,names])=>{b.querySelectorAll(id+' .hit').forEach(h=>{const r=rows[+h.dataset.k];
    h.onmouseenter=e=>{tip.innerHTML=`<b>${r.y}</b> · ${r.t} images<br>`+names.map((t,k)=>r.c[k]?`${esc(t)} : ${Math.round(r.c[k]/r.t*100)} %`:'').filter(Boolean).join('<br>');tip.hidden=false};
    h.onmousemove=e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'};h.onmouseleave=()=>tip.hidden=true;
    h.onclick=()=>{tip.hidden=true;F.y0=F.y1=r.y;refresh();setTargets();fit(true)}})});
  const c=$('#cs'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  ys.forEach((y,k)=>{const L=byY[y].n.slice().sort((a,d)=>(I.sat[a.i]<0.05)-(I.sat[d.i]<0.05)||I.hue[a.i]-I.hue[d.i]);const w=c.width/(L.length||1);L.forEach((n,j)=>{g.fillStyle='#'+I.dom[n.i];g.fillRect(j*w,k*22,Math.ceil(w),20)})});
  c.onclick=e=>{const r=c.getBoundingClientRect();const k=Math.floor((e.clientY-r.top)/r.height*ys.length);const y=ys[k];if(y){F.y0=F.y1=y;refresh();setTargets();fit(true)}};
  bindPeople(b)}

// ---------- project grid ----------
function renderGrid(){const g=$('#grid');g.innerHTML='';const by=new Map();VIS.forEach(n=>{if(!by.has(n.p))by.set(n.p,[]);by.get(n.p).push(n)});
  const ps=[...by.keys()].sort((a,b)=>(PR[b].y||0)-(PR[a].y||0)||PR[a].ty.localeCompare(PR[b].ty)||PR[a].t.localeCompare(PR[b].t));let cy=null;const frag=document.createDocumentFragment();
  ps.forEach(k=>{const p=PR[k];if(p.y!==cy){cy=p.y;const h=document.createElement('h2');h.textContent=p.y||'Sans date';frag.append(h)}
    const s=document.createElement('section');s.className='gp';const who=[...p.stu.slice(0,6),...p.tea.slice(0,3)].map(x=>PE[x]).join(', ');
    s.innerHTML=`<header><b>${esc(p.t)}</b><span>${esc(p.ty)} · ${p.lv==='MA'?'Master':p.lv==='BA'?'Bachelor':'BA et MA'}${who?' · '+esc(who):''}${p.prz.length?' · '+esc(p.prz.join(', ')):''}</span><a href="${esc(p.url)}" target="_blank" rel="noopener">Source ↗</a></header><div class="row">${by.get(k).map(n=>`<button type="button" data-n="${n.i}"><img loading="lazy" alt="" src="${url(n.i,480)}" width="${Math.round(150*n.ar)}" height="150"></button>`).join('')}</div>`;
    frag.append(s)});
  g.append(frag);g.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>select(N[+b.dataset.n]))}

// ---------- layout switch, attraction ----------
const gl=$('#gLay');LAYOUTS.forEach(l=>{const b=document.createElement('button');b.type='button';b.textContent=l.t;b.dataset.k=l.k;b.onclick=()=>setLay(l.k);gl.append(b)});
const ind=document.createElement('span');ind.className='ind';gl.prepend(ind);
function moveInd(){const b=gl.querySelector('[aria-pressed="true"]');if(!b)return;ind.style.width=b.offsetWidth+'px';ind.style.transform=`translateX(${b.offsetLeft}px)`}
function setLay(k){st.lay=k;save();try{history.replaceState(null,'','#'+(k==='grid'?'projets':k))}catch(e){}
  gl.querySelectorAll('button[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));requestAnimationFrame(moveInd);
  document.body.classList.toggle('isgrid',k==='grid');$('#grid').hidden=k!=='grid';$('#cv').hidden=k==='grid';
  const L=LAYOUTS.find(l=>l.k===k);$('#legend').innerHTML=L.d?L.d+'<span class="hint">Clic pour voir une image · glisser pour se déplacer · molette pour zoomer</span>':'';
  if(k==='grid')renderGrid();else{ensure(k);setTargets();setTimeout(()=>fit(true),40)}}
const spc=$('#spc'),spo=$('#spco');let spT=null;
function showAtt(){spo.innerHTML=st.att+'<small>%</small>';spc.style.setProperty('--p',st.att+'%')}
function setAtt(v){st.att=Math.round(Math.max(0,Math.min(100,v)));spc.value=st.att;showAtt();save();clearTimeout(spT);spT=setTimeout(()=>{if(st.lay!=='grid'){applyLayout(st.lay);setTargets()}},30)}
spc.addEventListener('input',()=>setAtt(+spc.value));$('#sless').onclick=()=>setAtt(st.att-10);$('#smore').onclick=()=>setAtt(st.att+10);
spc.value=st.att;showAtt();
addEventListener('resize',moveInd);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);const k=h==='projets'?'grid':h;if(LAYOUTS.some(l=>l.k===k)&&k!==st.lay)setLay(k)});
$('#loading').hidden=true;
refresh();setLay(st.lay);if(st.lay!=='grid'){ensure(st.lay);setTargets();N.forEach(n=>{n.x=n.tx;n.y=n.ty});fit(false)}
window.__mx={N,VIS:()=>VIS,setLay,setAtt,F,refresh,openSide,select};
})();

</script>
</body>
