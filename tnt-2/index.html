<style>
/* Layout : en-tête + vues, plan technique à gauche (internet en haut, LAN Downtown en bas), fiche à droite (vue ou élément cliqué). Thème unique noir, charte Downtown Studio. */
:root{
  --bg:#000000; --ink:#FFFFFF; --soft:#C8C8C8; --dim:#8A8A8A; --mute:#5A5A5A;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.4);
  --red:#E6483A; --ice:#BFC9D6;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;max-width:1800px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;border-bottom:1px solid var(--line2);padding-bottom:10px}
.idt{display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;align-items:flex-start}
.brand span{display:inline-block;background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;letter-spacing:.04em;padding:2px 4px;line-height:1.1}
.brand span+span{margin-left:34px;margin-top:2px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
h1{margin:2px 0 0;font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:22px;line-height:1}
nav.views{display:flex;flex-wrap:wrap;gap:6px}
nav.views button{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px;cursor:pointer}
nav.views button span{color:var(--dim);margin-right:6px}
nav.views button:hover{border-color:var(--ink)}
nav.views button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.views button[aria-current="true"] span{color:var(--red)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;overflow-x:auto}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);min-width:880px}
.panel{min-width:0;border-left:1px solid var(--line2);padding-left:20px;max-height:calc(100vh - 110px);overflow-y:auto}
@media (max-width:1100px){.panel{border-left:0;padding-left:0;border-top:1px solid var(--line2);padding-top:14px;max-height:none}}
.panel .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.panel h2{font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:21px;line-height:1.05;margin:0 0 8px}
.panel p{margin:0 0 12px;color:var(--soft);font-size:14px}
.panel h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);border-top:1px solid var(--line)}
.kv div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0;overflow-wrap:anywhere}
.kv div:nth-child(odd){color:var(--dim);padding-right:10px}
.list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{padding:6px 0 6px 16px;border-bottom:1px solid var(--line);font-size:13px;position:relative;color:var(--ink)}
.list li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:1px;background:var(--dim)}
.list li.warn::before{background:var(--red);height:6px;width:6px;top:11px;border-radius:50%}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.poc{border-color:var(--ice);color:var(--ice)} .tag.prop{border-style:dashed} .tag.conc{border-color:var(--red);color:var(--red);border-style:dashed} .tag.chk{border-color:var(--red);color:var(--red)} .tag.exc{color:var(--dim)}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.legend span{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft)}
.src{font-size:11px;color:var(--dim);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.back{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;cursor:pointer;margin-bottom:12px}
code{font-family:inherit;font-size:12.5px;background:#151515;padding:0 4px;overflow-wrap:anywhere}
.anim-in{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ——— plan ——— */
svg text{font-family:var(--font)}
.zone{fill:none;stroke:var(--line2);stroke-width:1}
.zonel{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;fill:var(--soft)}
.frame{fill:none;stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4}
.framel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;fill:var(--dim)}
.cap{font-size:9.5px;letter-spacing:.06em;fill:var(--dim)}
.nd{cursor:pointer;transition:opacity .35s}
.nd .box{fill:var(--bg);stroke:var(--ink);stroke-width:1.1;transition:stroke .25s,stroke-width .25s}
.nd.prop .box{stroke-dasharray:4 3}
.nd.conc .box{stroke:var(--red);stroke-dasharray:4 3}
.nd.poc .box{stroke:var(--ice)}
.nd.exc{opacity:.45}
.nd .t{font-size:12px;font-weight:800;font-variation-settings:"wdth" 82;text-transform:uppercase;letter-spacing:.02em;fill:var(--ink)}
.nd .l{font-size:10.5px;font-variation-settings:"wdth" 88;fill:var(--soft)}
.nd .st{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nd.chip .t{font-size:10.5px}
.nd.chip .l{font-size:9.5px}
.nd:hover .box{stroke-width:2.2}
.nd.sel .box{stroke:var(--red);stroke-width:2.6;stroke-dasharray:none}
.nd.dim{opacity:.18}
.nd.hl .box{stroke-width:2}
svg[data-view="ferme"] .nd.r-vid .box{stroke:var(--red);stroke-width:2}
svg[data-view="ferme"] .nd.r-img .box{stroke:var(--ink);stroke-width:2}
svg[data-view="ferme"] .nd.r-app .box{stroke:var(--ice);stroke-width:2;stroke-dasharray:4 3}
.ed{fill:none;stroke-linejoin:round;stroke-linecap:round;transition:opacity .35s}
.ed.off{opacity:0}
.eth{stroke:var(--ink);stroke-width:1.5}
.ssh{stroke:var(--ice);stroke-width:1.6;stroke-dasharray:5 3}
.api{stroke:var(--ice);stroke-width:1.6}
.job{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 4}
.smb{stroke:var(--dim);stroke-width:1.6;stroke-dasharray:2 3}
.mcp{stroke:var(--red);stroke-width:2}
.web{stroke:var(--soft);stroke-width:1.3;stroke-dasharray:1 4}
.elbl{font-size:9.5px;font-weight:600;letter-spacing:.04em;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;transition:opacity .35s}
.elbl.off{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';

const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const tx=(p,x,y,s,c,anc)=>{const t=el('text',{x,y,class:c},p);if(anc)t.setAttribute('text-anchor',anc);t.textContent=s;return t;};

/* ---------- zones ---------- */
const Z=el('g',{},svg);

function node(id,x,y,w,h,t,lines,o={}){
  const g=el('g',{class:'nd'+(o.st?' '+o.st:'')+(o.chip?' chip':'')+(o.role?' r-'+o.role:''),'data-id':id,tabindex:0,role:'button','aria-label':t},NG);
  el('rect',{x,y,width:w,height:h,class:'box'},g);

  (lines||[]).forEach((l,i)=>tx(g,x+(ch?6:9),y+(ch?26:31)+i*(ch?11:13),l,'l'));

  if(o.st==='chk'&&ch){el('circle',{cx:x+w-6,cy:y+6,r:3,fill:'#E6483A'},g);}

    tx(g,cx+7,y+54,c[0],'l').setAttribute('font-weight','700');c.slice(1).forEach((s,j)=>tx(g,cx+7,y+68+j*12,s,'l'));});}
  N[id]={g,x,y,w,h,t,info:o.info,st:o.st};

  return N[id];
}

node('gpu',CX[1],22,150,102,'GPU loué',['RTX 5090 · RunPod','0,69 à 1,19 $/h','ou LeaderGPU (UE)','LoRA vidéo, finition'],{st:'prop',info:[['Pourquoi','Aucune carte disponible au-delà de 16 Go hors RF-C9'],['Besoins','Entraînement des LoRA vidéo (24 Go min.), finition pleine précision'],['Tarifs relevés','RTX 5090 0,69 à 1,19 $/h, H100 2,69 à 3,99 $/h (RunPod)'],['Option','Prêt ponctuel de RF-C9, sans gêner Dadaland']]});
node('llm',CX[2],22,150,102,'Modèles hébergés',['Claude, ChatGPT','contexte envoyé par','les agents'],{info:[['Usage','Modèles qui font tourner les agents (Claude Code et autres)'],['Règle','Aucune image de plan explicite envoyée : métadonnées seulement'],['Règle','Aucun secret dans les prompts, identifiants en fichiers d’environnement']]});
node('api',CX[3],22,150,102,'Services en ligne',['fal.ai, LTX','World Labs','Hedra, Sync.so'],{st:'prop',info:[['World Labs','Lieux 3D (Marble, Atlas) : des lieux, jamais de visages'],['Lip sync','Hedra ou Sync.so, ou InfiniteTalk en local'],['API vidéo','fal.ai, LTX : options chiffrées en annexe du deck'],['Règle','Les visages sont générés uniquement sur nos machines']]});
node('supa',CX[4],22,150,102,'Supabase',['Données Deadline (relevé)','Registre IA (proposé)','export PDF'],{info:[['En place','Tâches Deadline terminées du 01.08 au 30.10.2026'],['Proposé','Registre de production IA : modèle, version, licence, LoRA, seed, prompt, machine, opérateur, interventions humaines'],['Rempli par','Le Shot Runner, une ligne par génération'],['Sortie','Export PDF pour festivals et assurance']]});
node('hqc',CX[5],22,150,102,'Dada HQ · cloud',['Supabase, Cloudflare R2','MCP distant OAuth, Yjs','fiche de validation'],{st:'conc',info:[['Statut','Concept du 31.10.2026, rien n’est construit'],['Comptes et données','Supabase, projet séparé de Dadaland'],['Aperçus','Cloudflare R2'],['Fiche et validations','Lien signé par personne, journal signé par le serveur'],['Agents web','MCP distant avec OAuth (Claude, ChatGPT)'],['Canvas','Yjs : positions et notes, jamais les fichiers'],['Rendu','File d’attente, chaque machine vient chercher son travail']]});
node('ddl',CX[6],22,150,102,'Dadaland',['Génération en ligne','essais, décors,','plans sans visage'],{info:[['Usage TNT','Essais, décors, plans sans visage'],['Lien DTS','RF-C9 (RTX 5090, Linux) fait tourner un ComfyUI dédié à la collaboration dadaland.ai'],['Option','Techniques exécutées sur crédits']]});
node('fw',380,158,340,30,'Pare-feu',['accès internet'],{info:[['Rôle','Sortie internet du studio'],['Règle','Kitsu et ComfyUI jamais exposés sur internet']]});
N.fw.g.querySelectorAll('.l')[0].setAttribute('x',560);N.fw.g.querySelectorAll('.l')[0].setAttribute('y',178);
node('wg',760,158,170,30,'VPN',[],{info:[['Usage','Télétravail'],['Règle','Accès Kitsu et ComfyUI par VPN uniquement']]});

node('core',380,222,340,36,'Cœur réseau',['2 commutateurs · lien de pair 400 Gb/s'],{info:[['Équipement','2 commutateurs de cœur, lien de pair 400 Gb/s'],['Charge mesurée','moins de 8 Gb/s au p99 sur 30 jours'],['Conclusion','Le cœur n’est pas un goulot, même avec 20 stations qui chargent des modèles'],['Température max.','27,6 °C dans la salle du cœur sur 30 jours']]});

function rounded(p,r=6){let d=`M${p[0][0]},${p[0][1]}`;for(let i=1;i<p.length-1;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1];const d1=Math.hypot(x1-x0,y1-y0),d2=Math.hypot(x2-x1,y2-y1);if(!d1||!d2)continue;const rr=Math.min(r,d1/2,d2/2);
  d+=`L${x1-(x1-x0)/d1*rr},${y1-(y1-y0)/d1*rr}Q${x1},${y1} ${x1+(x2-x1)/d2*rr},${y1+(y2-y1)/d2*rr}`;}const e=p[p.length-1];return d+`L${e[0]},${e[1]}`;}

  svg.setAttribute('data-view',v.id);
  Object.entries(N).forEach(([id,n])=>{n.g.classList.toggle('dim',!!v.hi&&!v.hi.includes(id));n.g.classList.remove('sel');});
  E.forEach(e=>{const on=e.views.includes(v.id);e.p.classList.toggle('off',!on);if(e.t)e.t.classList.toggle('off',!on||v.id==='ensemble');});
  [...vnav.children].forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));
  sel=null;render(v);
  if(!fromHash){try{history.replaceState(null,'','#'+v.id);}catch(e){}}
}
function showNode(id){const n=N[id];if(!n)return;sel=id;
  Object.values(N).forEach(m=>m.g.classList.remove('sel'));n.g.classList.add('sel');
  const st=n.st?`<span class="tag ${n.st}">${STL[n.st]}</span>`:'<span class="tag">en place</span>';
  panel.innerHTML=`<div class="anim-in"><button type="button" class="back" id="back">← ${VIEWS[cur].tab}</button><div class="k">Fiche</div><h2>${n.t}</h2><p>${st}</p>${n.info?kv(n.info):'<p>source manquante</p>'}</div>`;
  document.getElementById('back').onclick=()=>{n.g.classList.remove('sel');render(VIEWS[cur]);};
}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('.nd'))return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}
  else if(e.key==='Escape'&&sel){render(VIEWS[cur]);Object.values(N).forEach(m=>m.g.classList.remove('sel'));sel=null;}
  else if(e.key==='f'||e.key==='F'){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}catch(err){}}});
const fromHash=()=>{const h=(location.hash||'').slice(1);const i=VIEWS.findIndex(v=>v.id===h);return i<0?0:i;};
window.addEventListener('hashchange',()=>go(fromHash(),true));
go(fromHash(),true);
})();
</script>
