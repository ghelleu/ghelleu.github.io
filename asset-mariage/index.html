<title>Bestiaire du mariage</title>

<style>
/* Layout : planche de tri, filtres collés en haut, vignettes en colonnes étroites au format de la carte 10×21 */
:root{
  --bg:#ebe8e3; --surface:#f8f7f4; --fg:#231b1b; --muted:#6e6461; --line:#d6d0c8;
  --accent:#560002; --accent-fg:#ffffff; --star:#a8741a;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151011; --surface:#211a1b; --fg:#efe7e3; --muted:#a6989a; --line:#3a2f30;
  --accent:#c9686d; --accent-fg:#1a0b0c; --star:#e0b14f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151011; --surface:#211a1b; --fg:#efe7e3; --muted:#a6989a; --line:#3a2f30;
  --accent:#c9686d; --accent-fg:#1a0b0c; --star:#e0b14f; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header.top{padding-block:28px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.05;text-wrap:balance}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.count{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:92px;flex:none}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}
.chip:focus-visible,.card button:focus-visible,.lb button:focus-visible,.lb a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:8px 60px}
section.serie{padding-block:22px 6px}
section.serie h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section.serie h2 .code{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
section.serie p{color:var(--muted);margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.card .thumb{all:unset;cursor:zoom-in;display:block;aspect-ratio:var(--ratio,266/559);border-radius:3px;overflow:hidden;background:var(--line)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card .thumb:hover img{transform:scale(1.025)}
.card .thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.meta .t{min-width:0}
.meta .num{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--accent);font-variant-numeric:tabular-nums}
.meta .n{font-size:13px;line-height:1.3}
.meta .d{font-size:12px;color:var(--muted)}
.fav{all:unset;cursor:pointer;font-size:18px;line-height:1;color:var(--line);padding:2px 2px 4px}
.fav[aria-pressed="true"]{color:var(--star)}
.fav:hover{color:var(--star)}
.empty{color:var(--muted);padding:40px 0}
.lb{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;grid-column:2;grid-row:1;display:flex;justify-content:center;align-items:center;min-height:0;height:100%}
.lb figure img{max-height:calc(100vh - 150px);max-width:100%;width:auto;border-radius:3px}
.lb .nav{all:unset;cursor:pointer;font-size:30px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.lb .prev{grid-column:1;grid-row:1}.lb .next{grid-column:3;grid-row:1}
.lb .cap{grid-column:1 / -1;grid-row:2;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;text-align:center}
.lb .cap .n{font-family:var(--display);font-size:20px}
.lb .cap .d{color:var(--muted)}
.lb .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lb a.chip{text-decoration:none}
.lb .close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px))}
footer{color:var(--muted);font-size:12px;padding-block:0 40px}
@media (max-width:520px){.row .lbl{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lb{grid-template-columns:1fr}.lb .prev,.lb .next{display:none}.lb figure{grid-column:1}}
@media (prefers-reduced-motion:reduce){.card .thumb img{transition:none}}
body{margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.status{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
</style>

</head>

<header class="wrap top">
  <div>
    <h1 id="h1">Bestiaire du mariage</h1>
    <p class="lede" id="lede"></p>

  <div class="tools"><a class="chip" href="../media-explorer/" style="text-decoration:none">Media Explorer ↗</a><span class="count" id="count"></span><button class="chip" id="zipBtn" type="button">Télécharger la sélection en HD (zip)</button><span class="status" id="zipStatus"></span></div>
</header>

<div class="bar">

    <div class="row" id="rowDen" hidden><span class="lbl">Densité</span></div>
  </div>
</div>

<main class="wrap" id="main"></main>
<footer class="wrap">Vignettes d'aperçu. Les fichiers HD téléchargés portent le nom affiché (série, numéro, nom). Le zip prend les propositions visibles avec le filtre en cours. Les favoris restent dans ce navigateur.</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Aperçu">
  <button class="nav prev" id="lbPrev" aria-label="Précédente">‹</button>
  <figure><img id="lbImg" alt=""></figure>
  <button class="nav next" id="lbNext" aria-label="Suivante">›</button>
  <div class="cap">
    <div><div class="n" id="lbName"></div><div class="d" id="lbDesc"></div></div>
    <div class="act">
      <button class="chip" id="lbFav" aria-pressed="false">☆ Favori</button>
      <button class="chip" id="lbDl" type="button">Télécharger en HD</button>
      <a class="chip" id="lbHd" target="_blank" rel="noopener">Ouvrir en HD ↗</a>
      <button class="chip" id="lbCopy">Copier le nom</button>
    </div>
  </div>
  <button class="nav close" id="lbClose" aria-label="Fermer">×</button>
</div>

tle": "Visages retouchés", "sub": "Retouche des V3 · seuls les visages changent", "sec": "menus"}, {"code": "V6", "title": "Enluminure", "sub": "GPT Image 2.6 Flare · 2 compositions × 3 variantes × 3 densités", "sec": "menus"}, {"code": "V7", "title": "Stamp central", "sub": "GPT Image 2.6 Flare · deux animaux entrelacés en petit au centre, dessin linogravure net", "sec": "menus"}, {"code": "V8", "title": "Prod, aplats bleu et vert", "sub": "GPT Image 2.6 Sunburst · la proposition du baiser (V5 09) sur fond blanc, poisson bleu et agneau vert en aplat, variantes des yeux et de la bouche", "sec": "menus"}, {"code": "V9", "title": "Prod, yeux réalistes", "sub": "GPT Image 2.6 Flare en prompt pur, sans image de référence · même composition du baiser, yeux d'animal (point pour le poisson, amande à pupille fendue pour l'agneau)", "sec": "menus"}, {"code": "V10", "title": "Prod V8 01, yeux corrigés", "sub": "Zone Edit sur V8 01 posé sur fond blanc · seuls l'œil et la bouche du poisson et l'œil de l'agneau changent, le reste du dessin est conservé", "sec": "menus"}, {"code": "P01", "title": "Affiches film en patois", "sub": "18 oct. · Workflow « MARIAGE - Panneaux chimères patois (affiches film) » · Nano Banana Pro · un titre en patois par affiche", "sec": "panneaux"}, {"code": "P02", "title": "Peinture flamande, premiers essais", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · huile façon Bruegel et Bosch, puis six techniques et variantes de rendu", "sec": "panneaux"}, {"code": "P03", "title": "Calque typographique vermillon sur peinture", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · image gardée, couche graphique vermillon #FF3B1F posée dessus", "sec": "panneaux"}, {"code": "P04", "title": "Photographie éditoriale, premières pistes", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · tableau vivant, Caravage, vanité, Bosch, puis calque titre", "sec": "panneaux"}, {"code": "P05", "title": "Éditorial studio, deux séries", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · studio, toile peinte sur châssis, accessoires au sol", "sec": "panneaux"}, {"code": "P06", "title": "Éditorial studio, titres vermillon", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · calque titre sur la série studio, série numérotée de 8", "sec": "panneaux"}, {"code": "P07", "title": "Créatures, toile peinte façon Bruegel", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · corps de créature en effets pratiques, toile de fond peinte", "sec": "panneaux"}, {"code": "P08", "title": "Créatures, titres vermillon", "sub": "26 oct. · Fil panneaux · Nano Banana Pro · calque titre vermillon sur les créatures", "sec": "panneaux"}, {"code": "P09", "title": "Palette mariage, toiles Genève et Bresse", "sub": "27 oct. · Fil panneaux · Nano Banana Pro · palette olive, bleu ciel, crème, sang-de-bœuf ; fonds Escalade, Léman, Brou, vendanges", "sec": "panneaux"}, {"code": "P10", "title": "Titre AS Château, essais", "sub": "27 oct. · Fil panneaux · Nano Banana Pro · titre en AS Château posé sur la photo", "sec": "panneaux"}, {"code": "P11", "title": "Gouache, style Lou Benesch", "sub": "Nano Banana Pro, références de style Lou Benesch et gouache pointillée · 4 chimères, fond calme en haut pour le titre", "sec": "panneaux"}, {"code": "P12", "title": "Gouache, essais Sunburst", "sub": "GPT Image 2.5 Sunburst depuis l'app, mêmes références gouache", "sec": "panneaux"}, {"code": "P13", "title": "Caravage, titre AS Château", "sub": "Nano Banana Pro · 4 compositions repeintes en ténébrisme, puis titre AS Château bleu ciel intégré et numéro romain", "sec": "panneaux"}, {"code": "P14", "title": "Caravage v2, compo repensée", "sub": "Nano Banana Pro 4K · 8 chimères, peinture seule puis titre gothique intégré", "sec": "panneaux"}, {"code": "P15", "title": "Caravage, titre gothique", "sub": "Nano Banana Pro 4K · 8 chimères, peinture seule puis titre gothique intégré", "sec": "panneaux"}, {"code": "P16", "title": "12 chimères, passes A et B", "sub": "Nano Banana Pro 4K · passe A corrections, passe B titre AS Château", "sec": "panneaux"}, {"code": "P17", "title": "Éditorial (style Sissi)", "sub": "Nano Banana Pro · portrait mode en studio et typographie didone · noms déduits de l'ordre du workflow", "sec": "panneaux"}, {"code": "P18", "title": "Peinture brodée (style Licorne)", "sub": "Nano Banana Pro · touches denses façon broderie et serif · noms déduits de l'ordre du workflow", "sec": "panneaux"}, {"code": "P19", "title": "Graphique héraldique", "sub": "Nano Banana Pro · aplats sérigraphie et lettrage gothique AS Château · noms déduits de l'ordre du workflow", "sec": "panneaux"}, {"code": "P20", "title": "Papier découpé", "sub": "Nano Banana Pro · papiers découpés collés, Matisse et bestiaire · noms déduits de l'ordre du workflow", "sec": "panneaux"}, {"code": "P21", "title": "Flat contemporain contorsionné", "sub": "Nano Banana Pro · aplats nets sans texture · noms déduits de l'ordre du workflow", "sec": "panneaux"}, {"code": "P22", "title": "Pop dégradé et grain", "sub": "Nano Banana Pro · formes sans contour en dégradés · noms déduits de l'ordre du workflow", "sec": "panneaux"}, {"code": "P23", "title": "Aérographe grain", "sub": "Nano Banana Pro 4K · grands dégradés granuleux, palette mariage", "sec": "panneaux"}, {"code": "P24", "title": "14 styles × 3, Nano Banana", "sub": "Nano Banana Pro · Chevalier, Troubadour et Héraut dans 14 styles, titre monumental entrelacé", "sec": "panneaux"}, {"code": "P25", "title": "14 styles × 3, GPT Image 2.5", "sub": "Même série relancée en GPT Image 2.5 Flare", "sec": "panneaux"}, {"code": "P26", "title": "Refs 2, 14 styles × 3", "sub": "GPT Image 2.5 Flare · deuxième batch d'après les références", "sec": "panneaux"}, {"code": "P27", "title": "10 propositions libres", "sub": "GPT Image 2.5 Flare · une chimère habillée, gothique redessiné dans chaque style", "sec": "panneaux"}, {"code": "P28", "title": "10 directions design mature", "sub": "GPT Image 2.5 Flare · graphisme contemporain épuré", "sec": "panneaux"}, {"code": "P29", "title": "10 directions denses", "sub": "GPT Image 2.5 Flare · horror vacui, rempli bord à bord", "sec": "panneaux"}, {"code": "P30", "title": "Peinture douce naïve", "sub": "GPT Image 2.6 Flare · huile douce presque naïve, palette libre · deux passes", "sec": "panneaux"}, {"code": "P31", "title": "Pastel fantastique contemporain", "sub": "GPT Image 2.6 Flare · peinture surréaliste claire, palette pastel", "sec": "panneaux"}, {"code": "P32", "title": "Style menu, blanc sur bleu ciel", "sub": "GPT Image 2.6 Flare, référence de style V5 09 du menu · blanc seul sur bleu ciel, une figure en pied, titre gothique en haut et numéro romain en bas", "sec": "panneaux"}, {"code": "P33", "title": "Mises en situation dans l'orangerie", "sub": "Rendus de la salle avec les panneaux, depuis SketchUp et Matterport", "sec": "panneaux"}], "sections": [{"code": "menus", "title": "Menus", "lede": "Menus du dîner, carton 10 × 21 cm bordeaux. Le saumon en dorure blanche, l'agneau en dorure argent par-dessus. Toutes les propositions générées sur Dadaland, série par série.", "ratio": "266/559"}, {"code": "panneaux", "title": "Panneaux", "lede": "Les 8 grands panneaux muraux des chimères, 100 × 140 cm. Toutes les pistes générées sur Dadaland, dans l'ordre chronologique, des affiches en patois du 18 octobre à la série au style du menu. Les mises en situation dans l'orangerie sont à la fin.", "ratio": "3/4"}]}</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const ALL=DATA.items, ALLSERIES=DATA.series, SECTIONS=DATA.sections;
let ITEMS=ALL, SERIES=ALLSERIES;
const $=s=>document.querySelector(s);
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem('menus-favs')||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('menus-favs',JSON.stringify([...favs]))}catch(e){}};
const st={sec:'menus',serie:'all',comp:'all',den:'all'};
try{Object.assign(st,JSON.parse(localStorage.getItem('menus-filters')||'{}'))}catch(e){}
const hs=location.hash.slice(1);if(SECTIONS.some(s=>s.code===hs))st.sec=hs;
if(!SECTIONS.some(s=>s.code===st.sec))st.sec='menus';
window.addEventListener('hashchange',()=>{const c=location.hash.slice(1);if(SECTIONS.some(s=>s.code===c)&&c!==st.sec){st.sec=c;st.serie='all';render()}});
const saveSt=()=>{try{localStorage.setItem('menus-filters',JSON.stringify(st))}catch(e){}};

function chip(label,count,pressed,on){const b=document.createElement('button');b.className='chip';b.type='button';b.setAttribute('aria-pressed',pressed);b.innerHTML=label+(count!=null?` <small>${count}</small>`:'');b.onclick=on;return b}
function buildBars(){
  const rx=$('#rowSec');rx.querySelectorAll('.chip').forEach(c=>c.remove());
  SECTIONS.forEach(s=>rx.append(chip(s.title,ALL.filter(i=>ALLSERIES.find(x=>x.code===i.s).sec===s.code).length,st.sec===s.code,()=>{st.sec=s.code;st.serie='all';try{history.replaceState(null,'','#'+s.code)}catch(e){}render()})));
  const rs=$('#rowSerie');rs.querySelectorAll('.chip').forEach(c=>c.remove());
  rs.append(chip('Toutes',ITEMS.length,st.serie==='all',()=>{st.serie='all';render()}));
  SERIES.forEach(s=>rs.append(chip(s.code+' · '+s.title,ITEMS.filter(i=>i.s===s.code).length,st.serie===s.code,()=>{st.serie=s.code;render()})));
  rs.append(chip('★ Favoris',ITEMS.filter(i=>favs.has(i.i)).length,st.serie==='fav',()=>{st.serie='fav';render()}));
  const showV6=st.serie==='V6';
  const rc=$('#rowComp'),rd=$('#rowDen');rc.hidden=rd.hidden=!showV6;
  rc.querySelectorAll('.chip').forEach(c=>c.remove());rd.querySelectorAll('.chip').forEach(c=>c.remove());
  if(showV6){
    const v6=ITEMS.filter(i=>i.s==='V6');
    rc.append(chip('Toutes',null,st.comp==='all',()=>{st.comp='all';render()}));
    [...new Set(v6.map(i=>i.c))].forEach(c=>rc.append(chip(c+' · '+v6.find(i=>i.c===c).n,null,st.comp===c,()=>{st.comp=c;render()})));
    rd.append(chip('Toutes',null,st.den==='all',()=>{st.den='all';render()}));
    [['d1','dense'],['d2','équilibré'],['d3','aéré']].forEach(([d,l])=>rd.append(chip(d+' · '+l,null,st.den===d,()=>{st.den=d;render()})));
  }
}
function visible(){
  return ITEMS.filter(i=>{
    if(st.serie==='fav')return favs.has(i.i);
    if(st.serie!=='all'&&i.s!==st.serie)return false;
    if(st.serie==='V6'){if(st.comp!=='all'&&i.c!==st.comp)return false;if(st.den!=='all'&&i.d!==st.den)return false}
    return true});
}
let current=[];
function card(it,idx){
  const el=document.createElement('article');el.className='card';
  const desc=it.dl?it.dl:'';
  el.innerHTML=`<button class="thumb" type="button" aria-label="Agrandir ${it.s} ${it.num} ${it.n}"><img loading="lazy" src="${it.t}" alt="${it.s} ${it.num} · ${it.n}"></button>
  <div class="meta"><div class="t"><div class="num">${it.s} · ${it.num}</div><div class="n">${it.n}</div>${desc?`<div class="d">${desc}</div>`:''}</div>
  <button class="fav" type="button" aria-pressed="${favs.has(it.i)}" aria-label="Favori">${favs.has(it.i)?'★':'☆'}</button></div>`;
  el.querySelector('.thumb').onclick=()=>openLb(idx);
  el.querySelector('.fav').onclick=e=>{toggleFav(it.i);const b=e.currentTarget;b.setAttribute('aria-pressed',favs.has(it.i));b.textContent=favs.has(it.i)?'★':'☆';buildBars();if(st.serie==='fav')render()};
  return el;
}
function toggleFav(i){favs.has(i)?favs.delete(i):favs.add(i);saveFavs()}
function render(){
  const S=SECTIONS.find(s=>s.code===st.sec);
  SERIES=ALLSERIES.filter(s=>s.sec===st.sec);ITEMS=ALL.filter(i=>SERIES.some(s=>s.code===i.s));
  if(st.serie!=='all'&&st.serie!=='fav'&&!SERIES.some(s=>s.code===st.serie))st.serie='all';
  $('#lede').textContent=S.lede;document.documentElement.style.setProperty('--ratio',S.ratio);
  if(st.serie!=='V6'){st.comp='all';st.den='all'}
  saveSt();buildBars();
  current=visible();
  const m=$('#main');m.innerHTML='';
  $('#count').textContent=current.length+' proposition'+(current.length>1?'s':'');
  if(!current.length){m.innerHTML='<p class="empty">'+(st.serie==='fav'?'Aucun favori pour l\'instant. Clique sur ☆ sous une vignette pour la garder ici.':'Aucune proposition pour ce filtre.')+'</p>';return}
  const groups=st.serie==='fav'?[{code:null,title:'Favoris',sub:'Ta sélection'}]:SERIES.filter(s=>current.some(i=>i.s===s.code));
  groups.forEach(g=>{
    const list=current.filter(i=>g.code===null||i.s===g.code);
    const sec=document.createElement('section');sec.className='serie';
    sec.innerHTML=`<h2>${g.code?`<span class="code">${g.code}</span>`:''}${g.title}</h2><p>${g.sub}</p>`;
    const grid=document.createElement('div');grid.className='grid';
    list.forEach(it=>grid.append(card(it,current.indexOf(it))));
    sec.append(grid);m.append(sec);
  });
}
let lbIdx=0;
function openLb(i){lbIdx=i;fillLb();$('#lb').hidden=false;document.body.style.overflow='hidden';$('#lbClose').focus()}
function closeLb(){$('#lb').hidden=true;document.body.style.overflow=''}
function fillLb(){
  const it=current[lbIdx];
  $('#lbImg').src=it.t;$('#lbImg').alt=it.s+' '+it.num+' · '+it.n;
  $('#lbName').textContent=it.s+' · '+it.num+' · '+it.n;
  $('#lbDesc').textContent=(it.dl?('Densité '+it.dl+' · '):'')+(lbIdx+1)+' / '+current.length;
  $('#lbHd').href=it.url;
  const f=favs.has(it.i);$('#lbFav').setAttribute('aria-pressed',f);$('#lbFav').textContent=(f?'★':'☆')+' Favori';
  $('#lbCopy').textContent='Copier le nom';
}
$('#lbPrev').onclick=()=>{lbIdx=(lbIdx-1+current.length)%current.length;fillLb()};
$('#lbNext').onclick=()=>{lbIdx=(lbIdx+1)%current.length;fillLb()};
$('#lbClose').onclick=()=>{closeLb();render()};
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb'){closeLb();render()}});
$('#lbFav').onclick=()=>{toggleFav(current[lbIdx].i);fillLb()};
$('#lbCopy').onclick=()=>{const it=current[lbIdx];navigator.clipboard.writeText(it.file).then(()=>{$('#lbCopy').textContent='Copié : '+it.file}).catch(()=>{$('#lbCopy').textContent=it.file})};
document.addEventListener('keydown',e=>{if($('#lb').hidden)return;if(e.key==='Escape'){closeLb();render()}if(e.key==='ArrowLeft')$('#lbPrev').click();if(e.key==='ArrowRight')$('#lbNext').click()});

async function getBlob(it){const r=await fetch(it.url,{mode:'cors'});if(!r.ok)throw new Error(r.status);return r.blob()}
function saveBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
$('#lbDl').onclick=async()=>{const it=current[lbIdx];const b=$('#lbDl');b.textContent='Téléchargement…';
  try{saveBlob(await getBlob(it),it.file+'.'+it.ext);b.textContent='Téléchargé'}catch(e){b.textContent='Échec, utilise « Ouvrir en HD »'}};
$('#zipBtn').onclick=async()=>{
  const list=current.slice();if(!list.length)return;
  const btn=$('#zipBtn'),stt=$('#zipStatus');btn.disabled=true;
  if(typeof JSZip==='undefined'){stt.textContent='Bibliothèque zip non chargée, recharge la page.';btn.disabled=false;return}
  const zip=new JSZip();let n=0,fail=0;
  for(const it of list){stt.textContent=`${n}/${list.length} fichiers…`;
    try{zip.file(`${it.s}/${it.file}.${it.ext}`,await getBlob(it))}catch(e){fail++}
    n++}
  stt.textContent='Création du zip…';
  const label=st.serie==='all'?'tout':st.serie==='fav'?'favoris':st.serie+(st.comp!=='all'?'_'+st.comp:'')+(st.den!=='all'?'_'+st.den:'');
  const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
  saveBlob(blob,`${st.sec}_mariage_HD_${label}.zip`);
  stt.textContent=`${list.length-fail} fichiers HD`+(fail?`, ${fail} en échec`:'');btn.disabled=false};
render();
</script>
</body>
</html>
