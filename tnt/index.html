<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Workflow TNT × Downtown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
/* Layout : en-tête + choix du parcours, axonométrie pleine largeur, bandeau d'étape dessous (numéro, titre, texte, navigation). Thème unique noir, charte Downtown Studio. */
:root{
  --bg:#000000; --ink:#FFFFFF; --soft:#C8C8C8; --dim:#8A8A8A;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.4);
  --paper:#FFFFFF; --paper2:#EDEDED; --paper-ink:#000000; --side1:#D6D6D6; --side2:#B9B9B9;
  --night:#0B0B0B; --nside1:#2B2B2B; --nside2:#1C1C1C;
  --red:#E6483A; --ice:#BFC9D6;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 16px;max-width:1760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;border-bottom:1px solid var(--line2);padding-bottom:12px}
.idt{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start}
.brand span{display:inline-block;background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;letter-spacing:.04em;padding:2px 4px;line-height:1.1}
.brand span+span{margin-left:34px;margin-top:2px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.counter{font-size:11px;letter-spacing:.12em;color:var(--dim);font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:700}
nav.parts{display:flex;flex-wrap:wrap;gap:8px}
nav.parts button{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer;display:flex;gap:9px;align-items:center}
nav.parts button i{font-style:normal;display:inline-block;width:18px;height:3px;border-radius:2px}
nav.parts button:hover{border-color:var(--ink)}
nav.parts button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.stage{flex:1 1 auto;min-height:0;overflow-x:auto;display:flex;align-items:center}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 290px);min-height:300px;min-width:820px}

.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 28px;align-items:center;border-top:1px solid var(--line2);padding-top:14px}
@media (max-width:900px){.bar{grid-template-columns:auto minmax(0,1fr)}.nav{grid-column:1/-1}}
.big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-variation-settings:"wdth" 125;font-size:26px;transition:background .4s,color .4s}
.txt{min-width:0}
.txt .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.txt .k b{font-weight:600}
.txt h2{font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:clamp(20px,2vw,28px);line-height:1;margin:0 0 6px}
.txt p{margin:0;color:var(--soft);max-width:78ch}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);padding:5px 10px 5px 8px}
.chip svg{display:block}
.nav{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btns{display:flex;gap:10px}
.btns button{appearance:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center}
.btns button.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns button:disabled{opacity:.25;cursor:default}
.prog{display:flex;gap:3px;align-items:center}
.prog .grp{display:flex;gap:3px;margin-right:8px}
.prog span{display:block;width:12px;height:3px;background:var(--line2);border-radius:2px;cursor:pointer;transition:background .3s,width .3s}
.prog span.on{background:var(--ink)}
.prog span.cur{width:24px}
.hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.anim-in{animation:fadeup .45s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ——— dessin ——— */
svg text{font-family:var(--font)}
.slab0{fill:var(--paper2);stroke:var(--paper-ink);stroke-width:1}
.slab1{fill:var(--night);fill-opacity:.9;stroke:var(--ink);stroke-width:1}
.edge0{fill:var(--side2)} .edge1{fill:var(--ink);fill-opacity:.8}
.blk .top{stroke-width:1.2;transition:stroke .3s,stroke-width .3s,fill .3s}
.blk .s1,.blk .s2{transition:fill .3s}
.lv0 .top{fill:var(--paper);stroke:var(--paper-ink)} .lv0 .s1{fill:var(--side1);stroke:var(--paper-ink);stroke-width:.8} .lv0 .s2{fill:var(--side2);stroke:var(--paper-ink);stroke-width:.8}
.lv1 .top{fill:var(--night);stroke:var(--ink)} .lv1 .s1{fill:var(--nside1);stroke:var(--ink);stroke-width:.8} .lv1 .s2{fill:var(--nside2);stroke:var(--ink);stroke-width:.8}
.lbl{font-size:12.5px;font-weight:800;font-variation-settings:"wdth" 74;text-transform:uppercase;letter-spacing:.02em;pointer-events:none;transition:fill .3s}
.lv0 .lbl{fill:var(--paper-ink)} .lv1 .lbl{fill:var(--ink)}
.blk.back .lbl{font-size:11.5px;font-weight:700}
.blk{transition:opacity .45s ease}
.blk.todo,.blk.off{opacity:.22}
.blk.cur .top{stroke:var(--red);stroke-width:3}
.blk.cur .lbl{fill:var(--red)}
.blk.ping .top{stroke:var(--red);stroke-width:2.2}
.blk.ping .lbl{fill:var(--red)}
svg[data-part="all"] .r-trad .bdg,svg[data-part="all"] .r-syn .bdg{opacity:0}
.floor{transition:opacity .5s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
svg[data-part="trad"] #F1{opacity:.12}
svg[data-part="syn"] #F0{opacity:.25}
svg[data-part="intro"] .route-g,svg[data-part="trad"] .r-syn,svg[data-part="trad"] .r-hyb,svg[data-part="syn"] .r-trad,svg[data-part="syn"] .r-hyb,svg[data-part="hyb"] .r-trad,svg[data-part="hyb"] .r-syn{opacity:0}
.route-g{transition:opacity .4s}
.ghost{fill:none;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;opacity:.45}
.r-trad .ghost{stroke:var(--paper-ink)} .r-syn .ghost{stroke:var(--ice)} .r-hyb .ghost{stroke:var(--red)}
.prog-path{fill:none;stroke-linejoin:round;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.45,.1,.3,1)}
.r-trad .prog-path{stroke:var(--paper-ink);stroke-width:4}
.r-syn .prog-path{stroke:var(--ice);stroke-width:4}
.r-hyb .prog-path{stroke:var(--red);stroke-width:4.5}
.bdg{transition:opacity .35s ease,transform .35s ease;transform-box:fill-box;transform-origin:center}
.bdg.todo{opacity:0;transform:scale(.4)}
.bdg circle{stroke:var(--bg);stroke-width:2}
.r-trad .bdg circle{fill:var(--paper-ink);stroke:var(--paper)} .r-trad .bdg text{fill:var(--paper)}
.r-syn .bdg circle{fill:var(--ice)} .r-syn .bdg text{fill:#000}
.r-hyb .bdg circle{fill:var(--red)} .r-hyb .bdg text{fill:var(--ink)}
.bdg text{font-size:11.5px;font-weight:800}
.bdg.cur circle{r:14}
.bdg.cur .halo{opacity:1;animation:pulse 1.6s ease-out infinite}
.halo{fill:none;stroke:var(--red);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.lvlm text{text-transform:uppercase}
.lvlm .lv{font-size:14px;font-weight:900;font-variation-settings:"wdth" 125;fill:var(--ink)}
.lvlm .ln{font-size:10.5px;letter-spacing:.12em;fill:var(--dim)}
.lvlm line{stroke:var(--line2);stroke-width:1}
.lvlm polygon{fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="idt">
      <div class="brand" aria-label="Downtown Studio"><span>DOWNTOWN</span><span>STUDIO</span></div>
      <div>
        <div class="eyebrow">TNT × Downtown Studio · Trois workflows</div>
        <div class="counter" id="counter"></div>
      </div>
    </div>
    <nav class="parts" id="parts" aria-label="Parcours"></nav>
  </div>

  <div class="stage">
    <svg id="axo" data-part="intro" role="img" aria-label="Axonométrie : workflow traditionnel au niveau 0, briques IA au niveau 1, et parcours qui les traversent"></svg>
  </div>

  <section class="bar">
    <div class="big" id="big"></div>
    <div class="txt" id="txt" aria-live="polite"></div>
    <div class="nav">
      <div class="btns"><button type="button" id="prev" aria-label="Étape précédente">←</button><button type="button" id="next" class="next" aria-label="Étape suivante">→</button></div>
      <div class="prog" id="prog"></div>
      <div class="hint">← → naviguer · F plein écran</div>
    </div>
  </section>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('axo');
const U=100, H=2.05, PITCH=1.3, BW=0.9;
const C=i=>0.25+i*PITCH, CX=i=>C(i)+BW/2;
const W=C(8)+BW+0.25, D=2.8, T=0.08;
const FY0=1.2, FY1=1.95, BY0=0.2, BY1=0.85, BH=0.17, BHB=0.1;
const LT=2.27, LH=2.55, LS=2.35; // couloirs : traditionnel, hybride, synthétique
const EX=[0.99*U,0.15*U], EY=[-0.46*U,0.44*U];
const P=(x,y,z)=>[x*EX[0]+y*EY[0], x*EX[1]+y*EY[1]-z*U];
const pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const quad=(x0,y0,x1,y1,z)=>[P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)];

/* ---------- briques ---------- */
const B={};
function block(g,id,x0,y0,x1,y1,z,h,label,lv,back){
  const bg=el('g',{class:'blk lv'+lv+(back?' back':''),'data-id':id},g);
  el('polygon',{points:pts([P(x0,y1,z),P(x1,y1,z),P(x1,y1,z+h),P(x0,y1,z+h)]),class:'s1'},bg);
  el('polygon',{points:pts([P(x1,y0,z),P(x1,y1,z),P(x1,y1,z+h),P(x1,y0,z+h)]),class:'s2'},bg);
  el('polygon',{points:pts(quad(x0,y0,x1,y1,z+h)),class:'top'},bg);
  const c=back?P(x0+0.12,(y0+y1)/2,z+h):P((x0+x1)/2,(y0+y1)/2,z+h);
  const t=el('text',{x:c[0]+(back?0:0),y:c[1]+4.5,'text-anchor':back?'start':'middle',class:'lbl'},bg);t.textContent=label;
  B[id]=bg; return bg;
}
const root=el('g',{},svg);
// niveau 0
const F0=el('g',{id:'F0',class:'floor'},root);
el('polygon',{points:pts(quad(0,0,W,D,0)),class:'slab0'},F0);
el('polygon',{points:pts([P(0,D,0),P(W,D,0),P(W,D,-T),P(0,D,-T)]),class:'edge0'},F0);
el('polygon',{points:pts([P(W,0,0),P(W,D,0),P(W,D,-T),P(W,0,-T)]),class:'edge0'},F0);
block(F0,'gb0',C(0),BY0,C(2)+BW,BY1,0,BHB,'Plateau et salles',0,true);
block(F0,'gb1',C(3),BY0,C(6)+BW,BY1,0,BHB,'Ferme de rendu · 21 GPU',0,true);
block(F0,'gb2',C(7),BY0,C(8)+BW,BY1,0,BHB,'Auditorium Atmos',0,true);
const G0=['Découpage','Tournage','Montage','Layout 3D','Rendu','Compositing','Étalonnage','Son','Livrables'];
G0.forEach((n,i)=>block(F0,'g'+i,C(i),FY0,C(i)+BW,FY1,0,BH,n,0));
const RT=el('g',{class:'route-g r-trad'},root); // traditionnel, sous l'étage

// niveau 1
const F1=el('g',{id:'F1',class:'floor'},root);
el('polygon',{points:pts(quad(0,0,W,D,H)),class:'slab1'},F1);
el('polygon',{points:pts([P(0,D,H),P(W,D,H),P(W,D,H-T),P(0,D,H-T)]),class:'edge1'},F1);
el('polygon',{points:pts([P(W,0,H),P(W,D,H),P(W,D,H-T),P(W,0,H-T)]),class:'edge1'},F1);
block(F1,'ub',C(0),BY0,C(8)+BW,BY1,H,BHB,'Dada HQ · chaque version, chaque validation',1,true);
const G1={0:'Prompt',1:'Assets IA',2:'Text-to-video',3:'Images clés',4:'Vidéo guidée',5:'Finition IA',7:'Voix IA',8:'Export'};
Object.entries(G1).forEach(([i,n])=>block(F1,'u'+i,C(+i),FY0,C(+i)+BW,FY1,H,BH,n,1));
const RS=el('g',{class:'route-g r-syn'},root);
const RH=el('g',{class:'route-g r-hyb'},root);

/* ---------- parcours ---------- */
function route(g,points,stopIdx){
  const sp=points.map(p=>P(...p));
  const d='M'+sp.map(p=>p.map(v=>v.toFixed(1)).join(',')).join('L');
  el('path',{d,class:'ghost'},g);
  const pp=el('path',{d,class:'prog-path'},g);
  const cum=[0];for(let i=1;i<sp.length;i++)cum.push(cum[i-1]+Math.hypot(sp[i][0]-sp[i-1][0],sp[i][1]-sp[i-1][1]));
  const L=cum[cum.length-1];pp.style.strokeDasharray=L;pp.style.strokeDashoffset=L;
  const badges=stopIdx.map((pi,k)=>{const q=sp[pi];const b=el('g',{class:'bdg todo'},g);
    el('circle',{cx:q[0],cy:q[1],r:16,class:'halo'},b);
    el('circle',{cx:q[0],cy:q[1],r:11.5},b);const t=el('text',{x:q[0],y:q[1]+4,'text-anchor':'middle'},b);t.textContent=k+1;return b;});
  return {pp,L,len:stopIdx.map(i=>cum[i]),badges};
}
// 1 · traditionnel
const tradPts=G0.map((_,i)=>[CX(i),LT,0]);
const R1=route(RT,tradPts,tradPts.map((_,i)=>i));
// 2 · synthétique
const synPts=[[CX(0),LS,H],[CX(2),LS,H],[CX(8),LS,H]];
const R2=route(RS,synPts,[0,1,2]);
// 3 · hybride
const o=0.16;
const hp=[
 [CX(0),LH,0],                                   //0 s1 découpage
 [CX(1)-o,LH,0],[CX(1)-o,LH,H],[CX(1),LH,H],      //3 s2 assets
 [CX(1)+o,LH,H],[CX(1)+o,LH,0],
 [CX(2),LH,0],                                   //6 s3 montage
 [CX(3),LH,0],                                   //7 s4 layout
 [CX(3),LH,H],                                   //8 s5 images clés
 [CX(4),LH,H],                                   //9 s6 vidéo
 [CX(5),LH,H],                                   //10 s7 finition
 [CX(5),LH,0],                                   //11 s8 compositing
 [CX(6),LH,0],                                   //12 s9 étalonnage
 [CX(7)-o,LH,0],[CX(7)-o,LH,H],[CX(7),LH,H],      //15 s10 voix
 [CX(7)+o,LH,H],[CX(7)+o,LH,0],                  //17 s11 son
 [CX(8),LH,0]                                    //18 s12 livrables
];
const R3=route(RH,hp,[0,3,6,7,8,9,10,11,12,15,17,18]);

// repères de niveau
function level(z,lv,ln){const g=el('g',{class:'lvlm'},root);const q=P(0,D,z);const x=q[0]-20;
  el('line',{x1:q[0]-6,y1:q[1],x2:x-104,y2:q[1]},g);
  el('polygon',{points:`${x-98},${q[1]-1} ${x-90},${q[1]-1} ${x-94},${q[1]-8}`},g);
  const t=el('text',{x:x-104,y:q[1]+20,class:'lv'},g);t.textContent=lv;
  const t2=el('text',{x:x-104,y:q[1]+35,class:'ln'},g);t2.textContent=ln;}
level(0,'Niv. 0','Traditionnel');
level(H,'Niv. 1','Briques IA');
const xmin=P(0,D,0)[0]-135, xmax=P(W,0,0)[0]+20, ymin=P(0,0,H+BH)[1]-28, ymax=P(W,D,0)[1]+T*U+16;
svg.setAttribute('viewBox',`${xmin.toFixed(0)} ${ymin.toFixed(0)} ${(xmax-xmin).toFixed(0)} ${(ymax-ymin).toFixed(0)}`);

/* ---------- étapes ---------- */
const V='<svg width="12" height="24" viewBox="0 0 20 48" fill="currentColor"><circle cx="10" cy="5.5" r="4.2"/><path d="M5 11.5h10l1.6 16.5H3.4z"/><path d="M6.2 28h3.4l-.4 19H6.5zM10.4 28h3.4l-.3 19h-2.7z"/></svg>';
const PARTS={intro:{name:'Introduction',color:'#FFFFFF'},trad:{name:'Traditionnel',color:'#FFFFFF',n:1},syn:{name:'Synthétique',color:'#BFC9D6',n:2},hyb:{name:'Hybride',color:'#E6483A',n:3},all:{name:'Les trois',color:'#FFFFFF'}};
const S=[
 {part:'intro',title:'Deux niveaux de production',text:'En bas, le monde traditionnel : les métiers, l’équipe et le matériel de Downtown Studio. En haut, les briques IA. On suit trois façons de fabriquer le même film.'},
 {part:'trad',k:0,blk:'g0',title:'Découpage',text:'Le scénario est découpé plan par plan, environ 150 plans pour TNT.'},
 {part:'trad',k:1,blk:'g1',also:'gb0',title:'Tournage',text:'Les images sont tournées sur le plateau, ou cherchées dans les archives.'},
 {part:'trad',k:2,blk:'g2',also:'gb0',title:'Montage',text:'Le film se monte dans Resolve. La réalisation choisit les prises et le rythme.'},
 {part:'trad',k:3,blk:'g3',title:'Layout 3D',text:'Décors, caméra et animation sont construits dans Blender.'},
 {part:'trad',k:4,blk:'g4',also:'gb1',title:'Rendu',text:'Les plans 3D sont calculés sur la ferme de rendu : 21 stations GPU pilotées par Deadline.'},
 {part:'trad',k:5,blk:'g5',title:'Compositing',text:'Les couches sont assemblées dans Nuke ou Fusion.'},
 {part:'trad',k:6,blk:'g6',also:'gb0',title:'Étalonnage',text:'La couleur du film se règle dans Resolve ou sur Baselight.'},
 {part:'trad',k:7,blk:'g7',also:'gb2',title:'Son',text:'Voix, musique et mixage dans Pro Tools.'},
 {part:'trad',k:8,blk:'g8',title:'Livrables',text:'Master ProRes 4444 et DCP 2K pour les festivals. Chaque étape est un métier de l’équipe.'},
 {part:'syn',k:0,blk:'u0',title:'Prompt',text:'Chaque plan est décrit en texte.'},
 {part:'syn',k:1,blk:'u2',title:'Text-to-video',text:'Un modèle génère la vidéo du plan directement à partir de ce texte.'},
 {part:'syn',k:2,blk:'u8',title:'Export',text:'Le film sort en trois étapes. La plupart des briques restent inutilisées, et la réalisation n’a aucun point où reprendre la main.'},
 {part:'hyb',k:0,blk:'g0',title:'Découpage',text:'On part du découpage, comme dans le parcours traditionnel. Chaque plan reçoit une recette selon son type.'},
 {part:'hyb',k:1,blk:'u1',up:1,title:'Assets IA',text:'On monte fabriquer les personnages, les lieux en 3D et, si besoin, le jeu d’un acteur reporté sur le personnage.',v:'Direction artistique'},
 {part:'hyb',k:2,blk:'g2',down:1,title:'Montage',text:'L’animatique fixe la durée de chaque plan. Le montage reste le maître jusqu’à la fin.',v:'Réalisation'},
 {part:'hyb',k:3,blk:'g3',title:'Layout 3D',text:'Blender pose la caméra et rend les passes : profondeur, contours, pose.',v:'Réalisation'},
 {part:'hyb',k:4,blk:'u3',up:1,title:'Images clés',text:'Les passes guident l’image clé. Elle fixe le look et le visage du plan.',v:'Réalisation et DA'},
 {part:'hyb',k:5,blk:'u4',also:'gb1',title:'Vidéo guidée',text:'De nuit sur la ferme de Downtown, 4 à 10 prises par plan.',v:'Réalisation · prise retenue'},
 {part:'hyb',k:6,blk:'u5',title:'Finition IA',text:'La prise retenue passe en pleine précision : visages, upscale.'},
 {part:'hyb',k:7,blk:'g5',down:1,title:'Compositing',text:'Le plan redescend en séquence PNG 16 bits, dans Nuke ou Fusion.'},
 {part:'hyb',k:8,blk:'g6',title:'Étalonnage',text:'Conformation et étalonnage dans Resolve. Le look est posé depuis l’image clé.'},
 {part:'hyb',k:9,blk:'u7',up:1,title:'Voix IA',text:'Les voix témoins prennent le timbre du personnage, puis le lip sync.'},
 {part:'hyb',k:10,blk:'g7',down:1,also:'gb2',title:'Son',text:'Mixage dans Pro Tools.'},
 {part:'hyb',k:11,blk:'g8',also:'ub',title:'Livrables',text:'Les deux montages du palindrome. Dada HQ garde chaque version et chaque validation.',v:'Validation finale'},
 {part:'all',title:'Trois parcours',text:'Le parcours hybride garde les métiers de Downtown Studio et monte chercher une brique IA là où elle facilite la fabrication.'}
];
const ROUTES={trad:{R:R1,stops:S.filter(s=>s.part==='trad').map(s=>s.blk)},syn:{R:R2,stops:S.filter(s=>s.part==='syn').map(s=>s.blk)},hyb:{R:R3,stops:S.filter(s=>s.part==='hyb').map(s=>s.blk)}};

const partsNav=document.getElementById('parts'), prog=document.getElementById('prog');
const firstOf=p=>S.findIndex(s=>s.part===p);
['intro','trad','syn','hyb','all'].forEach(p=>{const b=document.createElement('button');b.type='button';b.dataset.part=p;
  b.innerHTML=(PARTS[p].n?`<i style="background:${PARTS[p].color}"></i>`:'')+`<span>${PARTS[p].n?PARTS[p].n+' · ':''}${PARTS[p].name}</span>`;
  b.onclick=()=>go(firstOf(p));partsNav.appendChild(b);});
// barre de progression groupée par parcours
let grp=null,last=null;S.forEach((s,i)=>{if(s.part!==last){grp=document.createElement('div');grp.className='grp';prog.appendChild(grp);last=s.part;}
  const sp=document.createElement('span');sp.title=`${i+1}`;sp.onclick=()=>go(i);grp.appendChild(sp);});
const segs=[...prog.querySelectorAll('span')];

let cur=0;
function setRoute(name,k){ // k = index courant (-1 = rien, 'full' = tout)
  const {R}=ROUTES[name];const full=k==='full';
  const len=full?R.L:(k<0?0:R.len[k]);
  R.pp.style.strokeDashoffset=(R.L-len).toFixed(1);
  R.badges.forEach((b,i)=>{b.classList.toggle('todo',!full&&i>k);b.classList.toggle('cur',!full&&i===k);});
}
function go(i,fromHash){
  i=Math.max(0,Math.min(S.length-1,i));cur=i;const s=S[i];
  svg.setAttribute('data-part',s.part);
  // parcours
  ['trad','syn','hyb'].forEach(n=>{if(s.part==='all')setRoute(n,'full');else if(s.part===n)setRoute(n,s.k);else setRoute(n,-1);});
  // briques
  Object.entries(B).forEach(([id,g])=>{g.classList.remove('todo','off','cur','ping');
    if(s.part==='intro'||s.part==='all')return;
    const st=ROUTES[s.part].stops;const pos=st.indexOf(id);
    if(pos<0){g.classList.add(id===s.also?'ping':'off');return;}
    // une brique peut être visitée plusieurs fois : on prend le dernier passage déjà fait
    const visited=st.slice(0,s.k+1).includes(id);
    if(id===s.blk)g.classList.add('cur');else if(!visited)g.classList.add('todo');
  });
  if(s.also&&B[s.also]){B[s.also].classList.remove('off');B[s.also].classList.add('ping');}
  // bandeau
  const P0=PARTS[s.part];
  const big=document.getElementById('big');
  if(s.k!==undefined){big.textContent=s.k+1;big.style.background=P0.color;big.style.color='#000';big.style.border='0';}
  else{big.textContent=s.part==='intro'?'0':'∑';big.style.background='transparent';big.style.color='#fff';big.style.border='1px solid rgba(255,255,255,.4)';}
  const tot=s.part in ROUTES?ROUTES[s.part].stops.length:0;
  const kicker=s.part in ROUTES?`Parcours ${P0.n} · <b style="color:${P0.color}">${P0.name}</b> · étape ${s.k+1} / ${tot}`:(s.part==='intro'?'Introduction':'Vue d’ensemble');
  const dir=s.up?' · <b style="color:#E6483A">↑ vers le niveau IA</b>':s.down?' · <b style="color:#E6483A">↓ retour au niveau 0</b>':'';
  const legend=s.part==='all'?`<div style="display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:13px">${['trad','syn','hyb'].map(n=>`<span style="display:inline-flex;align-items:center;gap:8px"><i style="display:inline-block;width:26px;height:4px;border-radius:2px;background:${PARTS[n].color}"></i>${PARTS[n].n} · ${PARTS[n].name}</span>`).join('')}</div>`:'';
  const txt=document.getElementById('txt');
  txt.innerHTML=`<div class="anim-in"><div class="k">${kicker}${dir}</div><h2>${s.title}</h2><p>${s.text}</p>${s.v?`<span class="chip">${V}Valide : ${s.v}</span>`:''}${legend}</div>`;
  document.getElementById('counter').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${S.length}`;
  [...partsNav.children].forEach(b=>b.setAttribute('aria-current',b.dataset.part===s.part?'true':'false'));
  segs.forEach((sp,j)=>{sp.classList.toggle('on',j<=i);sp.classList.toggle('cur',j===i);});
  document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===S.length-1;
  if(!fromHash){try{history.replaceState(null,'','#'+(i+1));}catch(e){}}
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(cur+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();}
  else if(e.key==='f'||e.key==='F'){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}catch(err){}}
});
const fromHash=()=>{const n=parseInt((location.hash||'').slice(1),10);return isNaN(n)?0:n-1;};
window.addEventListener('hashchange',()=>go(fromHash(),true));
go(fromHash(),true);
})();
</script>
</body>
</html>
