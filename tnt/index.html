<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Workflow TNT × Downtown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
/* Layout : en-tête + choix du parcours, plan à deux bandes (niveau IA en haut, Downtown Studio en bas), colonnes = phases, lignes = familles, bandeau d'étape dessous. Thème unique noir, charte Downtown Studio. */
:root{
  --bg:#000000; --ink:#FFFFFF; --soft:#C8C8C8; --dim:#8A8A8A; --faint:#2A2A2A;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.4);
  --red:#E6483A; --ice:#BFC9D6;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;max-width:1760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;border-bottom:1px solid var(--line2);padding-bottom:12px}
.idt{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start}
.brand span{display:inline-block;background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;letter-spacing:.04em;padding:2px 4px;line-height:1.1}
.brand span+span{margin-left:34px;margin-top:2px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.counter{font-size:11px;letter-spacing:.12em;color:var(--dim);font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:700}
nav.parts{display:flex;flex-wrap:wrap;gap:8px}
nav.parts button{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer;display:flex;gap:9px;align-items:center}
nav.parts button i{font-style:normal;display:inline-block;width:18px;height:3px;border-radius:2px}
nav.parts button:hover{border-color:var(--ink)}
nav.parts button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.stage{flex:1 1 auto;min-height:0;overflow-x:auto;display:flex;align-items:center;justify-content:center}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 270px);min-height:320px;min-width:900px}

.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 28px;align-items:center;border-top:1px solid var(--line2);padding-top:14px}
@media (max-width:900px){.bar{grid-template-columns:auto minmax(0,1fr)}.nav{grid-column:1/-1}}
.big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-variation-settings:"wdth" 125;font-size:26px;transition:background .4s,color .4s}
.txt{min-width:0}
.txt .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.txt .k b{font-weight:600}
.txt h2{font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:clamp(20px,2vw,28px);line-height:1;margin:0 0 6px}
.txt p{margin:0;color:var(--soft);max-width:82ch}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.spec span{font-size:11.5px;letter-spacing:.04em;color:var(--ink);border:1px solid var(--line2);padding:3px 8px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--red)!important;padding:3px 9px 3px 7px!important}
.chip svg{display:block;color:var(--red)}
.nav{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btns{display:flex;gap:10px}
.btns button{appearance:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center}
.btns button.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns button:disabled{opacity:.25;cursor:default}
.prog{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prog .grp{display:flex;gap:3px;margin-left:8px}
.prog span{display:block;width:11px;height:3px;background:var(--line2);border-radius:2px;cursor:pointer;transition:background .3s,width .3s}
.prog span.on{background:var(--ink)}
.prog span.cur{width:22px}
.hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.anim-in{animation:fadeup .45s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ——— plan ——— */
svg text{font-family:var(--font)}
.band{fill:none;stroke:var(--line2);stroke-width:1}
.bandlbl{font-size:15px;font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;fill:var(--ink)}
.bandsub{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;fill:var(--dim)}
.colh{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;fill:var(--soft)}
.coln{font-size:10.5px;font-weight:600;letter-spacing:.1em;fill:var(--dim)}
.colsep{stroke:var(--line);stroke-width:1}
.rowl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;fill:var(--dim)}
.rowsep{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}

.nd{transition:opacity .45s ease}
.nd rect.box{fill:var(--bg);stroke:var(--line2);stroke-width:1.2;transition:stroke .3s,stroke-width .3s,fill .3s}
.nd .t{font-size:13.5px;font-weight:800;font-variation-settings:"wdth" 82;text-transform:uppercase;letter-spacing:.02em;fill:var(--ink);transition:fill .3s}
.nd .s{font-size:11.5px;font-variation-settings:"wdth" 88;fill:var(--dim)}
.nd .gpu{fill:none;stroke:var(--soft);stroke-width:1}
.nd .gpu.res{fill:var(--soft)}
.nd .cell{fill:none;stroke:var(--line);stroke-width:1}
.nd .ct{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;fill:var(--soft)}
.nd .cs{font-size:9.5px;fill:var(--dim)}
.frame{fill:none;stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4}
.framet{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;fill:var(--soft)}
.nd.off{opacity:.18} .nd.todo{opacity:.3}
.nd.on rect.box{stroke:var(--ink)}
.nd.cur rect.box{stroke-width:2.6}
.nd.ping rect.box{stroke:var(--red);stroke-dasharray:4 3}
svg[data-route="trad"] .nd.cur rect.box{stroke:var(--ink);fill:#1A1A1A}
svg[data-route="syn"] .nd.cur rect.box{stroke:var(--ice);fill:#121519}
svg[data-route="hyb"] .nd.cur rect.box{stroke:var(--red);fill:#1E0B09}
svg[data-route="hyb"] .nd.cur .t{fill:var(--red)}
svg[data-route="syn"] .nd.cur .t{fill:var(--ice)}

.edge{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;transition:opacity .35s}
.e-trad{stroke:var(--ink)} .e-syn{stroke:var(--ice)} .e-hyb{stroke:var(--red);stroke-width:2.8}
.edge.res{stroke-dasharray:3 5;stroke-width:1.6}
.edge.hide{opacity:0}
.edge.draw{animation:draw .9s cubic-bezier(.45,.1,.3,1) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.bdg{transition:opacity .3s,transform .3s;transform-box:fill-box;transform-origin:center}
.bdg.hide{opacity:0;transform:scale(.5)}
.bdg circle{stroke:var(--bg);stroke-width:2}
.b-trad circle{fill:var(--ink)} .b-trad text{fill:var(--bg)}
.b-syn circle{fill:var(--ice)} .b-syn text{fill:var(--bg)}
.b-hyb circle{fill:var(--red)} .b-hyb text{fill:var(--ink)}
.bdg text{font-size:11px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="idt">
      <div class="brand" aria-label="Downtown Studio"><span>DOWNTOWN</span><span>STUDIO</span></div>
      <div>
        <div class="eyebrow">TNT × Downtown Studio · Trois workflows</div>
        <div class="counter" id="counter"></div>
      </div>
    </div>
    <nav class="parts" id="parts" aria-label="Parcours"></nav>
  </div>

  <div class="stage">
    <svg id="plan" viewBox="0 0 1400 640" data-route="none" role="img" aria-label="Plan à deux niveaux : briques IA en haut, Downtown Studio en bas, organisés par phase et par famille, avec les trois parcours de fabrication"></svg>
  </div>

  <section class="bar">
    <div class="big" id="big"></div>
    <div class="txt" id="txt" aria-live="polite"></div>
    <div class="nav">
      <div class="btns"><button type="button" id="prev" aria-label="Étape précédente">←</button><button type="button" id="next" class="next" aria-label="Étape suivante">→</button></div>
      <div class="prog" id="prog"></div>
      <div class="hint">← → naviguer · F plein écran</div>
    </div>
  </section>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('plan');
const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const tx=(p,x,y,s,cls,anchor)=>{const t=el('text',{x,y,class:cls},p);if(anchor)t.setAttribute('text-anchor',anchor);t.textContent=s;return t;};

/* ---------- grille : colonnes = phases, lignes = familles ---------- */
const COL={c0:[160,140],c1:[330,150],c2a:[510,150],c2b:[680,150],c3:[860,150],c4:[1040,150],c5:[1220,150]};
const ROW={p:[50,52],d:[112,40],i:[162,44],j:[216,44],s:[272,44], I:[360,44],J:[414,44],S:[468,44],K:[530,80]};
const PH=[['Écriture',160,300],['Matière',330,480],['Fabrication',510,830],['Assemblage',860,1010],['Finition',1040,1190],['Livraison',1220,1370]];

// fond : bandes, colonnes, lignes
const bg=el('g',{},svg);
PH.forEach(([n,a,b],k)=>{tx(bg,a,22,String(k+1).padStart(2,'0'),'coln');tx(bg,a+24,22,n,'colh');});
[315,495,845,1025,1205].forEach(x=>el('line',{x1:x,y1:32,x2:x,y2:622,class:'colsep'},bg));
el('rect',{x:8,y:40,width:1384,height:286,class:'band'},bg);
el('rect',{x:8,y:350,width:1384,height:272,class:'band'},bg);
tx(bg,20,64,'Niv. 1','bandlbl');tx(bg,20,80,'Briques IA','bandsub');
tx(bg,20,374,'Niv. 0','bandlbl');tx(bg,20,390,'Downtown Studio','bandsub');
[['Pilotage','p'],['Génération directe','d'],['Image','i'],['Son','s'],['Image','I'],['Son','S'],['Socle technique','K']].forEach(([n,r])=>{const [y,h]=ROW[r];if(r==='p'||r==='I'){}tx(bg,20,(r==='p'||r==='I')?y+h-2:y+h/2+4,n,'rowl');});
[[262,'i'],[322,'s']].forEach(()=>{});
[[156],[266],[518]].forEach(([y])=>el('line',{x1:150,y1:y,x2:1380,y2:y,class:'rowsep'},bg));
el('line',{x1:150,y1:108,x2:1380,y2:108,class:'rowsep'},bg);

/* ---------- nœuds ---------- */
const N={};
function node(id,col,row,t,s,o={}){
  let [x,w]=COL[col];let [y,h]=ROW[row];
  if(o.x!==undefined){x=o.x;w=o.w;} if(o.h)h=o.h; if(o.y!==undefined)y=o.y;
  const g=el('g',{class:'nd','data-id':id},svg);
  el('rect',{x,y,width:w,height:h,class:'box'},g);
  tx(g,x+10,y+18,t,'t');
  if(s)(Array.isArray(s)?s:[s]).forEach((l,i)=>tx(g,x+10,y+33+i*13,l,'s'));
  if(o.gpu){for(let k=0;k<o.gpu;k++)el('rect',{x:x+10+k*9,y:y+h-16,width:6,height:8,class:'gpu'+(o.res?' res':'')},g);}
  if(o.cells){const cx0=x+120,cw=(w-128)/o.cells.length;o.cells.forEach((c,k)=>{const cx=cx0+k*cw;el('rect',{x:cx,y:y+6,width:cw-6,height:h-12,class:'cell'},g);tx(g,cx+8,y+22,c[0],'ct');tx(g,cx+8,y+36,c[1],'cs');});}
  N[id]={g,x,y,w,h};return N[id];
}
// niveau 1
node('agents','c0','p','Agents',['Claude Code, Codex,','ChatGPT, Claude']);
node('hq','c1','p','Dada HQ',['source de vérité','du film'],{x:330,w:680,cells:[['Versions','rien n’est écrasé'],['Validations','sur la version exacte'],['Règles','lues par les agents'],['Registre IA','modèles et choix'],['Pointeurs','vers la ferme']]});
node('skills','c4','p','Skills',['workflows versionnés']);
node('prompt','c0','d','Prompt','');
node('t2v','c2a','d','Text-to-video','');
node('export','c5','d','Export','');
node('perso','c1','i','Personnages','LoRA, jeu d’acteur');
node('keyf','c2a','i','Images clés','ComfyUI');
node('vid','c2b','i','Vidéo guidée','Wan 2.2 VACE');
node('fin','c3','i','Finition IA','visages, upscale');
node('ctrl','c4','i','Contrôle','couleur automatique');
node('lieux','c1','j','Lieux 3D','World Labs');
node('musiq','c1','s','Musique IA','avec Mirwais');
node('voix','c2b','s','Voix IA','timbre, lip sync');
// niveau 0
node('dec','c0','I','Découpage','~150 plans');
node('tour','c1','I','Tournage','plateau');
node('mont','c2a','I','Montage','Resolve');
node('lay','c2b','I','Layout 3D','Blender');
node('comp','c3','I','Compositing','Nuke, Fusion');
node('etal','c4','I','Étalonnage','Resolve, Baselight');
node('livr','c5','I','Livrables',['ProRes 4444','DCP 2K','version web'],{h:152});
node('arch','c1','J','Archives','images existantes');
node('ren','c2b','J','Rendu','Deadline');
node('vrec','c1','S','Voix enregistrées','voix témoins');
node('mson','c3','S','Montage son','Pro Tools');
node('mix','c4','S','Mixage','Pro Tools');
// socle technique
node('plat','c1','K','Plateau et salles',['tournage, montage,','étalonnage'],{y:540,h:66});
node('nas','c2a','K','NAS',['stockage','des plans'],{y:540,h:66,w:150});
el('rect',{x:672,y:526,width:346,height:88,class:'frame'},svg);tx(svg,680,522,'Ferme de rendu · 21 GPU','framet');
node('rfab','c2b','K','RF-A/B','8 × 4080',{x:680,w:78,y:540,h:66,gpu:8});
node('rfc','c2b','K','RF-C','6 × 5080',{x:764,w:78,y:540,h:66,gpu:6});
node('prog','c3','K','Progress','7 × 4080 S',{x:848,w:78,y:540,h:66,gpu:7});
node('c9','c3','K','RF-C9','5090 · Dada',{x:932,w:78,y:540,h:66,gpu:1,res:true});
node('dl','c4','K','Deadline','file de rendu',{y:540,h:66});
node('atm','c5','K','Auditorium','Dolby Atmos',{y:540,h:66});

/* ---------- liaisons ---------- */
const R=(id)=>{const n=N[id];return [n.x+n.w,n.y+n.h/2];};
const L=(id)=>{const n=N[id];return [n.x,n.y+n.h/2];};
const Tp=(id,dx)=>{const n=N[id];return [n.x+(dx??n.w/2),n.y];};
const Bt=(id,dx)=>{const n=N[id];return [n.x+(dx??n.w/2),n.y+n.h];};
const Ly=(id,y)=>[N[id].x,y], Ry=(id,y)=>[N[id].x+N[id].w,y];
function rounded(p,r=7){let d=`M${p[0][0]},${p[0][1]}`;for(let i=1;i<p.length-1;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1];
  const d1=Math.hypot(x1-x0,y1-y0),d2=Math.hypot(x2-x1,y2-y1),rr=Math.min(r,d1/2,d2/2);
  const a=[x1-(x1-x0)/d1*rr,y1-(y1-y0)/d1*rr],b=[x1+(x2-x1)/d2*rr,y1+(y2-y1)/d2*rr];d+=`L${a[0]},${a[1]}Q${x1},${y1} ${b[0]},${b[1]}`;}
  const e=p[p.length-1];return d+`L${e[0]},${e[1]}`;}
const EG=el('g',{},svg); svg.insertBefore(EG,svg.querySelector('.nd')); // liaisons sous les nœuds
['trad','syn','hyb'].forEach(c=>{const m=el('marker',{id:'a-'+c,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},svg);
  el('path',{d:'M0,1L9,5L0,9z',fill:c==='trad'?'#fff':c==='syn'?'#BFC9D6':'#E6483A'},m);});
const E=[];
function edge(route,step,pts,o={}){const p=el('path',{d:rounded(pts),class:`edge e-${route}${o.res?' res':''} hide`,'marker-end':o.res?'':`url(#a-${route})`},EG);
  const L0=p.getTotalLength?p.getTotalLength():400;p.style.setProperty('--len',L0);if(!o.res)p.style.strokeDasharray=L0;E.push({route,step,p,res:!!o.res});}

// 1 · traditionnel
edge('trad',2,[R('dec'),L('tour')]);
edge('trad',2,[R('dec'),[315,382],[315,436],L('arch')]);
edge('trad',2,[R('dec'),[315,382],[315,490],L('vrec')]);
edge('trad',3,[R('tour'),L('mont')]);
edge('trad',3,[R('arch'),[495,436],[495,382],L('mont')]);
edge('trad',4,[R('mont'),L('lay')]);
edge('trad',5,[Bt('lay'),Tp('ren')]);
edge('trad',5,[Bt('ren',110),[790,540]],{res:true});
edge('trad',6,[R('ren'),[845,436],[845,382],L('comp')]);
edge('trad',7,[R('comp'),L('etal')]);
edge('trad',7,[R('vrec'),L('mson')]);
edge('trad',7,[Bt('mont',75),[585,490]]);
edge('trad',7,[R('mson'),L('mix')]);
edge('trad',8,[R('etal'),Ly('livr',382)]);
edge('trad',8,[R('mix'),Ly('livr',490)]);
// 2 · synthétique
edge('syn',2,[R('prompt'),L('t2v')]);
edge('syn',3,[R('t2v'),L('export')]);
// 3 · hybride
edge('hyb',2,[Tp('dec',70),[230,184],L('perso')]);
edge('hyb',2,[[230,240],L('lieux')]);
edge('hyb',2,[Bt('dec',70),[230,490],L('vrec')]);
edge('hyb',3,[R('musiq'),[492,294],[492,382],L('mont')]);
edge('hyb',4,[R('mont'),L('lay')]);
edge('hyb',4,[R('lieux'),[838,238],[838,342],[815,342],Tp('lay',135)]);
edge('hyb',5,[Tp('lay',20),[700,338],[600,338],Bt('keyf',90)]);
edge('hyb',5,[R('perso'),L('keyf')]);
edge('hyb',6,[R('keyf'),L('vid')]);
edge('hyb',6,[Tp('vid',75),[755,154],[585,154],Tp('keyf',75)],{res:true});
edge('hyb',7,[R('vid'),L('fin')]);
edge('hyb',7,[R('fin'),L('ctrl')]);
edge('hyb',8,[Bt('fin'),Tp('comp')]);
edge('hyb',9,[R('comp'),L('etal')]);
edge('hyb',9,[Bt('ctrl'),Tp('etal')]);
edge('hyb',10,[R('vrec'),[503,490],[503,294],L('voix')]);
edge('hyb',10,[R('voix'),[852,294],[852,490],L('mson')]);
edge('hyb',10,[R('mson'),L('mix')]);
edge('hyb',11,[R('etal'),Ly('livr',382)]);
edge('hyb',11,[R('mix'),Ly('livr',490)]);

/* ---------- étapes ---------- */
const V='<svg width="10" height="20" viewBox="0 0 20 48" fill="currentColor"><circle cx="10" cy="5.5" r="4.2"/><path d="M5 11.5h10l1.6 16.5H3.4z"/><path d="M6.2 28h3.4l-.4 19H6.5zM10.4 28h3.4l-.3 19h-2.7z"/></svg>';
const PARTS={intro:{name:'Architecture',color:'#FFFFFF'},trad:{name:'Traditionnel',color:'#FFFFFF',n:1},syn:{name:'Synthétique',color:'#BFC9D6',n:2},hyb:{name:'Hybride',color:'#E6483A',n:3},all:{name:'Les trois',color:'#FFFFFF'}};
const N1=['agents','hq','skills','prompt','t2v','export','perso','keyf','vid','fin','ctrl','lieux','musiq','voix'];
const SOCLE=['plat','nas','rfab','rfc','prog','c9','dl','atm'];
const N0=Object.keys(N).filter(k=>!N1.includes(k));
const FERME=['rfab','rfc','prog','c9'];
const S=[
 {part:'intro',title:'Deux niveaux, rangés par phase et par famille',text:'En bas, Downtown Studio : les métiers, l’équipe et le matériel. En haut, les briques IA. Les colonnes suivent les phases de fabrication, les lignes regroupent les familles : pilotage, image, son, socle technique.'},
 {part:'intro',hi:N0,title:'Niveau 0 · Downtown Studio',text:'Les métiers de la post-production et le socle technique. La ferme compte 21 stations GPU connectées. Elle tourne en moyenne à 3 à 5,5 % de sa capacité et ne calcule rien la nuit.',spec:['392 cœurs CPU','2,2 To de RAM','~1,1 PFLOPS FP32','RF-A/B · 8 × RTX 4080','RF-C · 6 × RTX 5080','Progress · 7 × RTX 4080 SUPER','RF-C9 · RTX 5090, réservée Dadaland','Cœur réseau 400 Gb/s']},
 {part:'intro',hi:['agents','hq','skills'],title:'Niveau 1 · Dada HQ',text:'La source de vérité du film. Chaque sauvegarde devient une version et rien n’est écrasé. Chaque validation est liée à la version exacte. Les fichiers lourds restent sur la ferme, Dada HQ garde des pointeurs. Les agents travaillent entre Blender, Resolve et ComfyUI, et n’approuvent jamais.',spec:['Versions · aperçu et origine','Validations · chaîne de relecteurs','Client · valide par un lien','Skills et workflows versionnés','Registre IA']},

 {part:'trad',k:1,nodes:['dec'],title:'Découpage',text:'Le scénario est découpé plan par plan.',spec:['~150 plans','10 minutes']},
 {part:'trad',k:2,nodes:['tour','arch','vrec'],also:['plat'],title:'Tournage, archives, voix',text:'La matière arrive en parallèle : les images tournées sur le plateau, les archives et les voix enregistrées.',spec:['Plateau Downtown Studio']},
 {part:'trad',k:3,nodes:['mont'],also:['nas'],title:'Montage',text:'Toute la matière converge dans Resolve. La réalisation choisit les prises et le rythme.',spec:['DaVinci Resolve']},
 {part:'trad',k:4,nodes:['lay'],title:'Layout 3D',text:'Les plans en 3D sont construits dans Blender : décors, caméra, animation.',spec:['Blender']},
 {part:'trad',k:5,nodes:['ren'],also:FERME.concat('dl'),title:'Rendu',text:'Les plans 3D sont calculés sur la ferme, en file Deadline.',spec:['21 stations GPU','Deadline']},
 {part:'trad',k:6,nodes:['comp'],title:'Compositing',text:'Les rendus et les images tournées sont assemblés dans Nuke ou Fusion.',spec:['Nuke','Fusion']},
 {part:'trad',k:7,nodes:['etal','mson','mix'],also:['atm'],title:'Étalonnage et son',text:'Deux chantiers en parallèle : la couleur dans Resolve ou sur Baselight, le son dans Pro Tools à partir du montage.',spec:['Resolve ou Baselight','Pro Tools','Auditorium Dolby Atmos']},
 {part:'trad',k:8,nodes:['livr'],title:'Livrables',text:'L’image et le son se rejoignent dans le master. Chaque étape est un métier de l’équipe.',spec:['ProRes 4444','DCP 2K','Version web']},

 {part:'syn',k:1,nodes:['prompt'],title:'Prompt',text:'Chaque plan est décrit en texte.'},
 {part:'syn',k:2,nodes:['t2v'],title:'Text-to-video',text:'Un modèle génère la vidéo du plan directement à partir de ce texte.'},
 {part:'syn',k:3,nodes:['export'],title:'Export',text:'Le film sort en trois étapes, sur une seule ligne. Aucune autre brique n’est utilisée, et la réalisation n’a aucun point où reprendre la main.'},

 {part:'hyb',k:1,nodes:['dec'],also:['skills'],title:'Découpage',text:'On part du découpage, comme dans le parcours traditionnel. Chaque plan reçoit une recette selon son type.',spec:['~150 plans','5 à 6 recettes']},
 {part:'hyb',k:2,nodes:['perso','lieux','vrec'],also:['hq'],up:1,title:'Personnages, lieux, voix témoins',text:'Trois chantiers partent en même temps. Au niveau IA, les personnages et les lieux. Au niveau 0, l’équipe enregistre les voix témoins.',spec:['LoRA sur une RTX 5090 louée','Lieux 3D · World Labs','Jeu d’acteur · Wan-Animate','Voix avec accord écrit'],v:'Direction artistique'},
 {part:'hyb',k:3,nodes:['musiq','mont'],down:1,title:'Animatique',text:'La musique, supervisée par Mirwais, rythme le montage avant toute génération. L’animatique fixe la durée de chaque plan.',spec:['Resolve','Musique IA'],v:'Réalisation'},
 {part:'hyb',k:4,nodes:['lay'],also:['dl'],title:'Layout 3D',text:'Blender reprend les lieux 3D, pose la caméra suivant l’animatique et rend les passes.',spec:['Passes EXR 720p via Deadline','Profondeur, contours, pose'],v:'Réalisation'},
 {part:'hyb',k:5,nodes:['keyf'],also:['hq'],up:1,title:'Images clés',text:'Les passes et les personnages convergent dans l’image clé. Elle fixe le look et le visage du plan.',spec:['ComfyUI','Z-Image, Qwen-Image','1 à 3 images par plan'],v:'Réalisation et DA'},
 {part:'hyb',k:6,nodes:['vid'],also:FERME.concat('dl','mont','hq'),title:'Vidéo guidée',text:'La génération tourne de nuit sur la ferme de Downtown. Une prise refusée repart à l’image clé ; la prise retenue remplace la précédente dans le montage.',spec:['Wan 2.2 VACE · 720p','4 à 10 prises par plan','~130 h GPU par nuit','Visages générés en local'],v:'Réalisation · prise retenue'},
 {part:'hyb',k:7,nodes:['fin','ctrl'],title:'Finition et contrôle',text:'La prise retenue est relancée en pleine précision. Chaque sortie passe un contrôle couleur automatique.',spec:['RTX 5090 louée','Upscale SeedVR2','Écrêtage, dérive, scintillement']},
 {part:'hyb',k:8,nodes:['comp'],also:['nas'],down:1,title:'Compositing',text:'Le plan redescend dans la post-production de Downtown.',spec:['Séquences PNG 16 bits','Nuke ou Fusion']},
 {part:'hyb',k:9,nodes:['etal'],down:1,title:'Étalonnage',text:'Le look est posé depuis l’image clé et vérifié à chaque sortie. L’étalonnage raccorde les plans et pousse le contraste final.',spec:['DaVinci Wide Gamut','Resolve ou Baselight']},
 {part:'hyb',k:10,nodes:['voix','mson','mix'],also:['atm'],up:1,title:'Voix et son',text:'En parallèle de l’image, les voix témoins prennent le timbre du personnage au niveau IA, puis rejoignent le montage son et le mixage.',spec:['Conversion de timbre en local','Chatterbox, RVC','Lip sync des dialogues','Pro Tools']},
 {part:'hyb',k:11,nodes:['livr'],also:['hq'],title:'Livrables',text:'Image et son se rejoignent. Les deux montages du palindrome. Dada HQ garde chaque version et chaque validation.',spec:['ProRes 4444','DCP 2K','Mention IA au générique'],v:'Validation finale'},

 {part:'all',title:'Trois parcours',text:'Le synthétique tient sur une ligne. Le parcours hybride garde les métiers et le matériel de Downtown Studio, ouvre des chantiers en parallèle et monte chercher une brique IA là où elle facilite la fabrication.'}
];
const ROUTES={};['trad','syn','hyb'].forEach(r=>{ROUTES[r]=S.filter(s=>s.part===r);});
// pastilles numérotées par parcours
const BG={trad:el('g',{},svg),syn:el('g',{},svg),hyb:el('g',{},svg)};
const BD=[];
Object.entries(ROUTES).forEach(([r,steps])=>steps.forEach(s=>s.nodes.forEach(id=>{const n=N[id];const g=el('g',{class:`bdg b-${r} hide`},BG[r]);
  el('circle',{cx:n.x+n.w-2,cy:n.y+2,r:10},g);const t=el('text',{x:n.x+n.w-2,y:n.y+6,'text-anchor':'middle'},g);t.textContent=s.k;BD.push({r,k:s.k,g});})));

const partsNav=document.getElementById('parts'),prog=document.getElementById('prog');
const grpOf=p=>p;
const firstOf=p=>S.findIndex(s=>s.part===p);
['intro','trad','syn','hyb','all'].forEach(p=>{const b=document.createElement('button');b.type='button';b.dataset.part=p;
  b.innerHTML=(PARTS[p].n?`<i style="background:${PARTS[p].color}"></i>`:'')+`<span>${PARTS[p].n?PARTS[p].n+' · ':''}${PARTS[p].name}</span>`;b.onclick=()=>go(firstOf(p));partsNav.appendChild(b);});
let grp=null,last=null;S.forEach((s,i)=>{if(s.part!==last){grp=document.createElement('div');grp.className='grp';prog.appendChild(grp);last=s.part;}
  const sp=document.createElement('span');sp.title=`${i+1}`;sp.onclick=()=>go(i);grp.appendChild(sp);});
const segs=[...prog.querySelectorAll('span')];

let cur=0;
function go(i,fromHash){
  i=Math.max(0,Math.min(S.length-1,i));const prev=cur;cur=i;const s=S[i];
  const route=s.part in ROUTES?s.part:(s.part==='all'?'all':'none');
  svg.setAttribute('data-route',route);
  // liaisons
  E.forEach(e=>{const p=e.p;p.classList.remove('draw');
    let show=false,anim=false;
    if(route==='all')show=true;
    else if(route===e.route){show=e.step<=s.k;anim=e.step===s.k&&!e.res;}
    p.classList.toggle('hide',!show);
    if(show&&!e.res){if(anim){void p.getBoundingClientRect();p.classList.add('draw');}else p.style.strokeDashoffset=0;}
  });
  // nœuds
  const seen=new Set(),now=new Set(s.nodes||[]),inRoute=new Set();
  if(route in ROUTES){ROUTES[route].forEach(st=>{st.nodes.forEach(n=>{inRoute.add(n);if(st.k<=s.k)seen.add(n);});});}
  Object.entries(N).forEach(([id,n])=>{const c=n.g.classList;c.remove('off','todo','on','cur','ping');
    if(route==='none'){if(s.hi&&!s.hi.includes(id))c.add('off');else if(s.hi)c.add('on');return;}
    if(route==='all'){c.add('on');return;}
    if(now.has(id))c.add('cur','on');
    else if((s.also||[]).includes(id))c.add('ping');
    else if(seen.has(id))c.add('on');
    else if(inRoute.has(id))c.add('todo');
    else c.add('off');});
  BD.forEach(b=>b.g.classList.toggle('hide',!(route===b.r&&b.k<=s.k)&&!(route==='all'&&b.r==='hyb')));
  // bandeau
  const P0=PARTS[s.part],big=document.getElementById('big');
  if(s.k!==undefined){big.textContent=s.k;big.style.background=P0.color;big.style.color='#000';big.style.border='0';}
  else{big.textContent=s.part==='all'?'∑':String(i);big.style.background='transparent';big.style.color='#fff';big.style.border='1px solid rgba(255,255,255,.4)';}
  const tot=route in ROUTES?ROUTES[route].length:0;
  const kicker=route in ROUTES?`Parcours ${P0.n} · <b style="color:${P0.color}">${P0.name}</b> · étape ${s.k} / ${tot}`:(s.part==='all'?'Vue d’ensemble':'Architecture');
  const dir=s.up?' · <b style="color:#E6483A">↑ niveau IA</b>':s.down?' · <b style="color:#E6483A">↓ niveau 0</b>':'';
  const legend=s.part==='all'?`<div style="display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:13px">${['trad','syn','hyb'].map(n=>`<span style="display:inline-flex;align-items:center;gap:8px"><i style="display:inline-block;width:26px;height:3px;border-radius:2px;background:${PARTS[n].color}"></i>${PARTS[n].n} · ${PARTS[n].name}</span>`).join('')}</div>`:'';
  const spec=(s.spec||s.v)?`<div class="spec">${s.v?`<span class="chip">${V}Valide : ${s.v}</span>`:''}${(s.spec||[]).map(x=>`<span>${x}</span>`).join('')}</div>`:'';
  document.getElementById('txt').innerHTML=`<div class="anim-in"><div class="k">${kicker}${dir}</div><h2>${s.title}</h2><p>${s.text}</p>${spec}${legend}</div>`;
  document.getElementById('counter').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${S.length}`;
  [...partsNav.children].forEach(b=>b.setAttribute('aria-current',b.dataset.part===s.part?'true':'false'));
  segs.forEach((sp,j)=>{sp.classList.toggle('on',j<=i);sp.classList.toggle('cur',j===i);});
  document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===S.length-1;
  if(!fromHash){try{history.replaceState(null,'','#'+(i+1));}catch(e){}}
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(cur+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();}
  else if(e.key==='f'||e.key==='F'){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}catch(err){}}
});
const fromHash=()=>{const n=parseInt((location.hash||'').slice(1),10);return isNaN(n)?0:n-1;};
window.addEventListener('hashchange',()=>go(fromHash(),true));
go(fromHash(),true);
})();
</script>
