<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Workflow TNT × Downtown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
/* Layout : en-tête + choix du parcours, deux cartes de circuit superposées en axonométrie, bandeau d'étape dessous. Thème unique noir, charte Downtown Studio. */
:root{
  --bg:#000000; --ink:#FFFFFF; --soft:#C8C8C8; --dim:#8A8A8A; --faint:#3A3A3A;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.4);
  --board0:#121212; --board1:#080808;
  --red:#E6483A; --ice:#BFC9D6;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;max-width:1760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;border-bottom:1px solid var(--line2);padding-bottom:12px}
.idt{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start}
.brand span{display:inline-block;background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;letter-spacing:.04em;padding:2px 4px;line-height:1.1}
.brand span+span{margin-left:34px;margin-top:2px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.counter{font-size:11px;letter-spacing:.12em;color:var(--dim);font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:700}
nav.parts{display:flex;flex-wrap:wrap;gap:8px}
nav.parts button{appearance:none;background:transparent;border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer;display:flex;gap:9px;align-items:center}
nav.parts button i{font-style:normal;display:inline-block;width:18px;height:3px;border-radius:2px}
nav.parts button:hover{border-color:var(--ink)}
nav.parts button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.stage{flex:1 1 auto;min-height:0;overflow-x:auto;display:flex;align-items:center}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 280px);min-height:300px;min-width:860px}

.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 28px;align-items:center;border-top:1px solid var(--line2);padding-top:14px}
@media (max-width:900px){.bar{grid-template-columns:auto minmax(0,1fr)}.nav{grid-column:1/-1}}
.big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-variation-settings:"wdth" 125;font-size:26px;transition:background .4s,color .4s}
.txt{min-width:0}
.txt .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.txt .k b{font-weight:600}
.txt h2{font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:clamp(20px,2vw,28px);line-height:1;margin:0 0 6px}
.txt p{margin:0;color:var(--soft);max-width:80ch}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.spec span{font-size:11.5px;letter-spacing:.04em;color:var(--ink);border:1px solid var(--line2);padding:3px 8px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--red);color:var(--ink);padding:3px 9px 3px 7px}
.chip svg{display:block;color:var(--red)}
.nav{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btns{display:flex;gap:10px}
.btns button{appearance:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center}
.btns button.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns button:disabled{opacity:.25;cursor:default}
.prog{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prog .grp{display:flex;gap:3px;margin-left:8px}
.prog span{display:block;width:11px;height:3px;background:var(--line2);border-radius:2px;cursor:pointer;transition:background .3s,width .3s}
.prog span.on{background:var(--ink)}
.prog span.cur{width:22px}
.hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.anim-in{animation:fadeup .45s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ——— circuit ——— */
svg text{font-family:var(--font)}
.board{stroke:var(--ink);stroke-width:1.2}
.b0{fill:var(--board0)} .b1{fill:var(--board1);fill-opacity:.93}
.bedge{fill:var(--ink);fill-opacity:.55}
.fid{fill:none;stroke:var(--ink);stroke-width:1}
.dots{fill:var(--ink);opacity:.16}
.bus{fill:none;stroke:var(--faint);stroke-width:1.4}
.stub{fill:none;stroke:var(--faint);stroke-width:1}
.buslbl{font-size:10px;font-weight:600;letter-spacing:.14em;fill:var(--dim);text-transform:uppercase}
.boardlbl{font-size:15px;font-weight:900;font-variation-settings:"wdth" 125;letter-spacing:.06em;fill:var(--ink);text-transform:uppercase}
.boardsub{font-size:10px;letter-spacing:.14em;fill:var(--dim);text-transform:uppercase}

.cmp{transition:opacity .45s ease}
.cmp .body{fill:var(--bg);stroke:var(--ink);stroke-width:1.1;transition:stroke .3s,stroke-width .3s}
.cmp .pins{stroke:var(--ink);stroke-width:1.1;fill:none;transition:stroke .3s}
.cmp .p1{fill:var(--ink)}
.cmp .ttl{font-size:14.5px;font-weight:800;font-variation-settings:"wdth" 68;text-transform:uppercase;letter-spacing:.03em;fill:var(--ink);transition:fill .3s}
.cmp .sub{font-size:12px;font-variation-settings:"wdth" 80;fill:var(--soft)}
.cmp .gpu{fill:none;stroke:var(--ink);stroke-width:.9}
.cmp .gpu.res{fill:var(--ink);fill-opacity:.35}
.cmp .cell{fill:none;stroke:var(--line2);stroke-width:.8}
.cmp .cellt{font-size:9.5px;font-weight:700;font-variation-settings:"wdth" 80;fill:var(--soft);text-transform:uppercase;letter-spacing:.03em}
.cmp .cells{font-size:8.5px;fill:var(--dim)}
.cmp.todo,.cmp.off{opacity:.2}
.cmp.cur .body{stroke:var(--red);stroke-width:2.6}
.cmp.cur .pins{stroke:var(--red)} .cmp.cur .p1{fill:var(--red)}
.cmp.cur .ttl{fill:var(--red)}
.cmp.ping .body{stroke:var(--red);stroke-width:1.8}
.cmp.ping .ttl{fill:var(--red)}
.floor{transition:opacity .5s ease}
.decor{transition:opacity .5s ease}
svg[data-part="trad"] #F1,svg[data-part="dts"] #F1{opacity:.14}
svg[data-part="syn"] #F0,svg[data-part="hq"] #F0{opacity:.22}
svg[data-part="trad"] .decor,svg[data-part="syn"] .decor,svg[data-part="hyb"] .decor{opacity:.45}

.route-g{transition:opacity .4s}
svg[data-part="intro"] .route-g,svg[data-part="dts"] .route-g,svg[data-part="hq"] .route-g,svg[data-part="trad"] .r-syn,svg[data-part="trad"] .r-hyb,svg[data-part="syn"] .r-trad,svg[data-part="syn"] .r-hyb,svg[data-part="hyb"] .r-trad,svg[data-part="hyb"] .r-syn{opacity:0}
.ghost{fill:none;stroke-width:1.6;stroke-dasharray:2 6;stroke-linecap:round;opacity:.55}
.r-trad .ghost{stroke:var(--ink)} .r-syn .ghost{stroke:var(--ice)} .r-hyb .ghost{stroke:var(--red)}
.prog-path{fill:none;stroke-linejoin:round;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.45,.1,.3,1)}
.r-trad .prog-path{stroke:var(--ink);stroke-width:3.2}
.r-syn .prog-path{stroke:var(--ice);stroke-width:3.2}
.r-hyb .prog-path{stroke:var(--red);stroke-width:3.6}
.via{fill:var(--bg);stroke:var(--red);stroke-width:1.6}
.bdg{transition:opacity .35s ease,transform .35s ease;transform-box:fill-box;transform-origin:center}
.bdg.todo{opacity:0;transform:scale(.4)}
.bdg .pad{stroke-width:2}
.r-trad .pad{fill:var(--bg);stroke:var(--ink)} .r-trad .bdg text{fill:var(--ink)}
.r-syn .pad{fill:var(--bg);stroke:var(--ice)} .r-syn .bdg text{fill:var(--ice)}
.r-hyb .pad{fill:var(--bg);stroke:var(--red)} .r-hyb .bdg text{fill:var(--ink)}
.bdg text{font-size:11px;font-weight:800}
.bdg.cur .pad{r:13}
.r-trad .bdg.cur .pad{fill:var(--ink)} .r-trad .bdg.cur text{fill:var(--bg)}
.r-syn .bdg.cur .pad{fill:var(--ice)} .r-syn .bdg.cur text{fill:var(--bg)}
.r-hyb .bdg.cur .pad{fill:var(--red)}
.halo{fill:none;stroke:var(--red);stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center}
.bdg.cur .halo{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.8);opacity:0}}
svg[data-part="all"] .r-trad .bdg,svg[data-part="all"] .r-syn .bdg{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="idt">
      <div class="brand" aria-label="Downtown Studio"><span>DOWNTOWN</span><span>STUDIO</span></div>
      <div>
        <div class="eyebrow">TNT × Downtown Studio · Trois workflows</div>
        <div class="counter" id="counter"></div>
      </div>
    </div>
    <nav class="parts" id="parts" aria-label="Parcours"></nav>
  </div>

  <div class="stage">
    <svg id="axo" data-part="intro" role="img" aria-label="Deux cartes de circuit superposées : l'architecture Downtown Studio au niveau 0, les briques IA et Dada HQ au niveau 1, et les trois parcours qui les traversent"></svg>
  </div>

  <section class="bar">
    <div class="big" id="big"></div>
    <div class="txt" id="txt" aria-live="polite"></div>
    <div class="nav">
      <div class="btns"><button type="button" id="prev" aria-label="Étape précédente">←</button><button type="button" id="next" class="next" aria-label="Étape suivante">→</button></div>
      <div class="prog" id="prog"></div>
      <div class="hint">← → naviguer · F plein écran</div>
    </div>
  </section>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('axo');
const U=100, H=2.35, PITCH=1.3, CW=1.02;
const C=i=>0.3+i*PITCH, CX=i=>C(i)+CW/2;
const W=C(8)+CW+0.3, D=3.05, T=0.06;
const BK0=0.28, BK1=1.08, BUS=1.27, FR0=1.47, FR1=2.08;   // rangées
const LT=2.42, LH=2.7, LS=2.5;                             // pistes : traditionnel, hybride, synthétique
const EX=[0.99*U,0.13*U], EY=[-0.36*U,0.40*U];
const P=(x,y,z)=>[x*EX[0]+y*EY[0], x*EX[1]+y*EY[1]-z*U];
const pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const quad=(x0,y0,x1,y1,z)=>[P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)];
const M=(x,y,z)=>{const o=P(x,y,z);return `matrix(${EX[0]/U},${EX[1]/U},${EY[0]/U},${EY[1]/U},${o[0].toFixed(1)},${o[1].toFixed(1)})`;};
const seg=(a,b)=>`M${a.join(',')}L${b.join(',')}`;
const txt=(g,x,y,z,s,cls,dx=0,dy=0)=>{const t=el('text',{transform:M(x,y,z),x:dx,y:dy,class:cls},g);t.textContent=s;return t;};

/* ---------- composants ---------- */
const CMP={};
function comp(g,id,x0,y0,x1,y1,z,ttl,sub,o={}){
  const cg=el('g',{class:'cmp','data-id':id},g);
  el('polygon',{points:pts(quad(x0,y0,x1,y1,z)),class:'body'},cg);
  // broches sur les deux grands côtés
  const n=o.pins??Math.max(3,Math.round((x1-x0)/0.17));let d='';
  for(let k=0;k<n;k++){const x=x0+(k+0.5)*(x1-x0)/n;d+=seg(P(x,y0,z),P(x,y0-0.06,z))+seg(P(x,y1,z),P(x,y1+0.06,z));}
  el('path',{d,class:'pins'},cg);
  const p1=P(x0+0.07,y0+0.08,z);el('circle',{cx:p1[0],cy:p1[1],r:2,class:'p1'},cg);
  txt(cg,x0+0.12,y0,z,ttl,'ttl',0,23);
  if(sub)(Array.isArray(sub)?sub:[sub]).forEach((s,i)=>txt(cg,x0+0.12,y0,z,s,'sub',0,39+i*14));
  if(o.gpu){const n=o.gpu,sz=0.075,gap=0.035;for(let k=0;k<n;k++){const gx=x0+0.12+k*(sz+gap),gy=y1-0.18;
    el('polygon',{points:pts(quad(gx,gy,gx+sz,gy+sz*1.3,z)),class:'gpu'+(o.res?' res':'')},cg);}}
  if(o.cells){const cw=(x1-x0-0.24)/o.cells.length;o.cells.forEach((c,k)=>{const cx0=x0+0.12+k*cw,cy0=y0+0.42,cy1=y1-0.1;
    el('polygon',{points:pts(quad(cx0+0.02,cy0,cx0+cw-0.02,cy1,z)),class:'cell'},cg);
    txt(cg,cx0+0.07,cy0,z,c[0],'cellt',0,14);txt(cg,cx0+0.07,cy0,z,c[1],'cells',0,26);});}
  CMP[id]=cg;return cg;
}
function board(g,z,cls,name,sub){
  el('polygon',{points:pts(quad(0,0,W,D,z)),class:'board '+cls},g);
  el('polygon',{points:pts([P(0,D,z),P(W,D,z),P(W,D,z-T),P(0,D,z-T)]),class:'bedge'},g);
  el('polygon',{points:pts([P(W,0,z),P(W,D,z),P(W,D,z-T),P(W,0,z-T)]),class:'bedge'},g);
  // trame de points
  let d='';for(let x=0.15;x<W;x+=0.25)for(let y=0.15;y<D;y+=0.25){const p=P(x,y,z);d+=`M${(p[0]-.6).toFixed(1)},${p[1].toFixed(1)}h1.2`;}
  el('path',{d,class:'dots',stroke:'#fff','stroke-width':1.2},g);
  [[0.12,0.12],[W-0.12,0.12],[W-0.12,D-0.12],[0.12,D-0.12]].forEach(([x,y])=>{const p=P(x,y,z);el('circle',{cx:p[0],cy:p[1],r:4,class:'fid'},g);el('circle',{cx:p[0],cy:p[1],r:1.3,fill:'#fff'},g);});
}
function busAndStubs(g,z,label,front,back,laneTo){
  const dg=el('g',{class:'decor'},g);
  el('path',{d:seg(P(0.3,BUS,z),P(W-0.3,BUS,z)),class:'bus'},dg);
  txt(dg,0.32,BUS,z,label,'buslbl',0,-4);
  front.forEach(i=>{el('path',{d:seg(P(CX(i),FR0-0.06,z),P(CX(i),BUS,z)),class:'stub'},dg);el('path',{d:seg(P(CX(i),FR1+0.06,z),P(CX(i),laneTo,z)),class:'stub'},dg);});
  back.forEach(x=>el('path',{d:seg(P(x,BK1+0.06,z),P(x,BUS,z)),class:'stub'},dg));
}

const root=el('g',{},svg);
/* niveau 0 · Downtown Studio */
const F0=el('g',{id:'F0',class:'floor'},root);
board(F0,0,'b0');
busAndStubs(F0,0,'Réseau DTS · cœur 400 Gb/s',[0,1,2,3,4,5,6,7,8],[CX(0)+0.6,CX(2),CX(3),CX(4),CX(5),CX(6),CX(7),CX(8)],LH);
comp(F0,'plat',C(0),BK0,C(1)+CW,BK1,0,'Plateau et salles',['tournage, montage, étalonnage']);
comp(F0,'nas',C(2),BK0,C(2)+CW,BK1,0,'NAS',['stockage des plans']);
comp(F0,'rfab',C(3),BK0,C(3)+CW,BK1,0,'RF-A/B',['8 × RTX 4080'],{gpu:8});
comp(F0,'rfc',C(4),BK0,C(4)+CW,BK1,0,'RF-C',['6 × RTX 5080'],{gpu:6});
comp(F0,'prog',C(5),BK0,C(5)+CW,BK1,0,'Progress',['7 × RTX 4080 S'],{gpu:7});
comp(F0,'c9',C(6),BK0,C(6)+CW,BK1,0,'RF-C9',['RTX 5090 · Dadaland'],{gpu:1,res:true});
comp(F0,'dl',C(7),BK0,C(7)+CW,BK1,0,'Deadline',['file de rendu']);
comp(F0,'atm',C(8),BK0,C(8)+CW,BK1,0,'Auditorium',['Dolby Atmos']);
const G0=[['Découpage','~150 plans'],['Tournage','plateau, archives'],['Montage','Resolve'],['Layout 3D','Blender'],['Rendu','Deadline'],['Compositing','Nuke, Fusion'],['Étalonnage','Resolve, Baselight'],['Son','Pro Tools'],['Livrables','ProRes, DCP 2K']];
G0.forEach((c,i)=>comp(F0,'g'+i,C(i),FR0,C(i)+CW,FR1,0,c[0],c[1]));
txt(F0,0.3,0,0,'Niv. 0 · Downtown Studio','boardlbl',0,-10);
const RT=el('g',{class:'route-g r-trad'},root);

/* niveau 1 · briques IA */
const F1=el('g',{id:'F1',class:'floor'},root);
board(F1,H,'b1');
busAndStubs(F1,H,'Bus Dada HQ · versions et pointeurs',[0,1,2,3,4,5,6,7,8],[CX(0)+0.6,CX(2)+0.5,CX(4),CX(6)-0.3,CX(7),CX(8)],LS+0.35);
comp(F1,'agents',C(0),BK0,C(1)+CW,BK1,H,'Agents',['Claude Code, Codex, ChatGPT, Claude','préparent, lancent, enregistrent']);
comp(F1,'hq',C(2),BK0,C(6)+CW,BK1,H,'Dada HQ',null,{cells:[['Versions','rien n’est écrasé'],['Validations','sur la version exacte'],['Règles','lues par chaque agent'],['Registre IA','modèles, choix humains'],['Pointeurs','vers la ferme']]});
comp(F1,'skills',C(7),BK0,C(7)+CW,BK1,H,'Skills',['workflows versionnés']);
comp(F1,'music',C(8),BK0,C(8)+CW,BK1,H,'Musique IA',['avec Mirwais']);
const G1=[['Prompt','texte libre'],['Assets IA','LoRA, lieux 3D'],['Text-to-video','un prompt, un plan'],['Images clés','ComfyUI'],['Vidéo guidée','Wan 2.2 VACE'],['Finition IA','visages, upscale'],['Contrôle','couleur auto'],['Voix IA','timbre, lip sync'],['Export','vidéo finale']];
G1.forEach((c,i)=>comp(F1,'u'+i,C(i),FR0,C(i)+CW,FR1,H,c[0],c[1]));
txt(F1,0.3,0,H,'Niv. 1 · Briques IA','boardlbl',0,-10);
const RS=el('g',{class:'route-g r-syn'},root);
const RH=el('g',{class:'route-g r-hyb'},root);

/* ---------- parcours ---------- */
function route(g,points,stopIdx,vias){
  const sp=points.map(p=>P(...p));
  const d='M'+sp.map(p=>p.map(v=>v.toFixed(1)).join(',')).join('L');
  el('path',{d,class:'ghost'},g);
  const pp=el('path',{d,class:'prog-path'},g);
  (vias||[]).forEach(i=>{const q=sp[i];el('circle',{cx:q[0],cy:q[1],r:4.5,class:'via'},g);});
  const cum=[0];for(let i=1;i<sp.length;i++)cum.push(cum[i-1]+Math.hypot(sp[i][0]-sp[i-1][0],sp[i][1]-sp[i-1][1]));
  const L=cum[cum.length-1];pp.style.strokeDasharray=L;pp.style.strokeDashoffset=L;
  const badges=stopIdx.map((pi,k)=>{const q=sp[pi];const b=el('g',{class:'bdg todo'},g);
    el('circle',{cx:q[0],cy:q[1],r:15,class:'halo'},b);
    el('circle',{cx:q[0],cy:q[1],r:10.5,class:'pad'},b);const t=el('text',{x:q[0],y:q[1]+4,'text-anchor':'middle'},b);t.textContent=k+1;return b;});
  return {pp,L,len:stopIdx.map(i=>cum[i]),badges};
}
const R1=route(RT,G0.map((_,i)=>[CX(i),LT,0]),G0.map((_,i)=>i));
const R2=route(RS,[[CX(0),LS,H],[CX(2),LS,H],[CX(8),LS,H]],[0,1,2]);
const o=0.17;
const hp=[
 [CX(0),LH,0],
 [CX(1)-o,LH,0],[CX(1)-o,LH,H],[CX(1),LH,H],[CX(1)+o,LH,H],[CX(1)+o,LH,0],
 [CX(2),LH,0],[CX(3),LH,0],[CX(3)+0.001,LH,H],[CX(4),LH,H],[CX(5),LH,H],[CX(5)+0.001,LH,0],
 [CX(6),LH,0],

const grpOf=p=>(p==='dts'||p==='hq')?'intro':p;
const S=[
 {part:'intro',title:'Deux niveaux de production',text:'En bas, l’architecture de Downtown Studio : les métiers, l’équipe et le matériel. En haut, les briques IA et Dada HQ. On suit ensuite trois façons de fabriquer le même film.'},
 {part:'dts',hi:['plat','nas','rfab','rfc','prog','c9','dl','atm'],title:'Niveau 0 · l’architecture DTS',text:'La ferme de rendu compte 21 stations GPU connectées. Elle tourne en moyenne à 3 à 5,5 % de sa capacité et ne calcule rien la nuit.',spec:['392 cœurs CPU','2,2 To de RAM','~1,1 PFLOPS FP32','RF-A/B · 8 × RTX 4080','RF-C · 6 × RTX 5080','Progress · 7 × RTX 4080 SUPER','RF-C9 · RTX 5090, réservée Dadaland','Cœur réseau 400 Gb/s']},
 {part:'hq',hi:['agents','hq','skills'],title:'Niveau 1 · Dada HQ',text:'La source de vérité du film. Chaque sauvegarde devient une version et rien n’est écrasé. Chaque validation est liée à la version exacte. Les fichiers lourds restent sur la ferme, Dada HQ garde des pointeurs. Les agents travaillent entre Blender, Resolve et ComfyUI, et n’approuvent jamais.',spec:['Versions · aperçu et origine','Validations · chaîne de relecteurs','Client · valide par un lien','Skills et workflows versionnés','Registre IA']},
 {part:'trad',k:0,blk:'g0',title:'Découpage',text:'Le scénario est découpé plan par plan.',spec:['~150 plans','10 minutes']},
 {part:'trad',k:1,blk:'g1',also:['plat'],title:'Tournage',text:'Les images sont tournées sur le plateau, ou cherchées dans les archives.',spec:['Plateau Downtown Studio']},
 {part:'trad',k:2,blk:'g2',also:['plat','nas'],title:'Montage',text:'Le film se monte dans Resolve. La réalisation choisit les prises et le rythme.',spec:['DaVinci Resolve']},
 {part:'trad',k:3,blk:'g3',title:'Layout 3D',text:'Décors, caméra et animation sont construits dans Blender.',spec:['Blender']},

 {part:'trad',k:8,blk:'g8',title:'Livrables',text:'Le master et les copies pour les festivals. Chaque étape est un métier de l’équipe.',spec:['ProRes 4444','DCP 2K','Version web']},
 {part:'syn',k:0,blk:'u0',title:'Prompt',text:'Chaque plan est décrit en texte.'},

 {part:'hyb',k:2,blk:'g2',down:1,also:['hq'],title:'Montage',text:'L’animatique fixe la durée de chaque plan. Le montage reste le maître jusqu’à la fin.',spec:['Animatique Resolve','Voix témoins','Musique'],v:'Réalisation'},
 {part:'hyb',k:3,blk:'g3',also:['dl','rfab','rfc'],title:'Layout 3D',text:'Blender pose la caméra et rend les passes qui guideront l’IA.',spec:['Passes EXR 720p via Deadline','Profondeur, contours, pose'],v:'Réalisation'},
 {part:'hyb',k:4,blk:'u3',up:1,also:['hq'],title:'Images clés',text:'Les passes guident l’image clé. Elle fixe le look et le visage du plan.',spec:['ComfyUI','Z-Image, Qwen-Image','ControlNet sur les passes','1 à 3 images par plan'],v:'Réalisation et DA'},
 {part:'hyb',k:5,blk:'u4',also:['rfab','rfc','prog','dl','hq'],title:'Vidéo guidée',text:'La génération tourne de nuit sur la ferme de Downtown.',spec:['Wan 2.2 VACE · 720p','4 à 10 prises par plan','~130 h GPU par nuit','Visages générés en local'],v:'Réalisation · prise retenue'},
 {part:'hyb',k:6,blk:'u5',also:['u6'],title:'Finition IA',text:'La prise retenue est relancée en pleine précision, puis contrôlée.',spec:['RTX 5090 louée','Visages, upscale SeedVR2','Contrôle couleur automatique']},
 {part:'hyb',k:7,blk:'g5',down:1,also:['nas'],title:'Compositing',text:'Le plan redescend dans la post-production classique.',spec:['Séquences PNG 16 bits','Nuke ou Fusion']},

const ROUTES={trad:{R:R1,stops:S.filter(s=>s.part==='trad').map(s=>s.blk)},syn:{R:R2,stops:S.filter(s=>s.part==='syn').map(s=>s.blk)},hyb:{R:R3,stops:S.filter(s=>s.part==='hyb').map(s=>s.blk)}};

const partsNav=document.getElementById('parts'), prog=document.getElementById('prog');
const firstOf=p=>S.findIndex(s=>grpOf(s.part)===p);
['intro','trad','syn','hyb','all'].forEach(p=>{const b=document.createElement('button');b.type='button';b.dataset.part=p;
  b.innerHTML=(PARTS[p].n?`<i style="background:${PARTS[p].color}"></i>`:'')+`<span>${PARTS[p].n?PARTS[p].n+' · ':''}${PARTS[p].name}</span>`;
  b.onclick=()=>go(firstOf(p));partsNav.appendChild(b);});
let grp=null,last=null;S.forEach((s,i)=>{const g=grpOf(s.part);if(g!==last){grp=document.createElement('div');grp.className='grp';prog.appendChild(grp);last=g;}
  const sp=document.createElement('span');sp.title=`${i+1}`;sp.onclick=()=>go(i);grp.appendChild(sp);});
const segs=[...prog.querySelectorAll('span')];

let cur=0;
function setRoute(name,k){const {R}=ROUTES[name];const full=k==='full';
  const len=full?R.L:(k<0?0:R.len[k]);R.pp.style.strokeDashoffset=(R.L-len).toFixed(1);
  R.badges.forEach((b,i)=>{b.classList.toggle('todo',!full&&i>k);b.classList.toggle('cur',!full&&i===k);});}
function go(i,fromHash){
  i=Math.max(0,Math.min(S.length-1,i));cur=i;const s=S[i];
  svg.setAttribute('data-part',s.part);
  ['trad','syn','hyb'].forEach(n=>{if(s.part==='all')setRoute(n,'full');else if(s.part===n)setRoute(n,s.k);else setRoute(n,-1);});
  Object.entries(CMP).forEach(([id,g])=>{g.classList.remove('todo','off','cur','ping');
    if(s.part==='intro'||s.part==='all')return;
    if(s.hi){if(!s.hi.includes(id))g.classList.add('off');return;}
    const st=ROUTES[s.part].stops;
    if(id===s.blk){g.classList.add('cur');return;}
    if((s.also||[]).includes(id)){g.classList.add('ping');return;}
    if(st.indexOf(id)<0){g.classList.add('off');return;}
    if(!st.slice(0,s.k+1).includes(id))g.classList.add('todo');
  });
  const P0=PARTS[grpOf(s.part)], big=document.getElementById('big');
  if(s.k!==undefined){big.textContent=s.k+1;big.style.background=P0.color;big.style.color='#000';big.style.border='0';}
  else{big.textContent=s.part==='all'?'∑':s.part==='dts'?'N0':s.part==='hq'?'N1':'·';big.style.background='transparent';big.style.color='#fff';big.style.border='1px solid rgba(255,255,255,.4)';big.style.fontSize=s.part==='dts'||s.part==='hq'?'18px':'26px';}
  if(s.k!==undefined)big.style.fontSize='26px';
  const tot=s.part in ROUTES?ROUTES[s.part].stops.length:0;
  const kicker=s.part in ROUTES?`Parcours ${P0.n} · <b style="color:${P0.color}">${P0.name}</b> · étape ${s.k+1} / ${tot}`:(s.part==='all'?'Vue d’ensemble':'Architecture');
  const dir=s.up?' · <b style="color:#E6483A">↑ vers le niveau IA</b>':s.down?' · <b style="color:#E6483A">↓ retour au niveau 0</b>':'';
  const legend=s.part==='all'?`<div style="display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:13px">${['trad','syn','hyb'].map(n=>`<span style="display:inline-flex;align-items:center;gap:8px"><i style="display:inline-block;width:26px;height:4px;border-radius:2px;background:${PARTS[n].color}"></i>${PARTS[n].n} · ${PARTS[n].name}</span>`).join('')}</div>`:'';
  const spec=(s.spec||s.v)?`<div class="spec">${s.v?`<span class="chip">${V}Valide : ${s.v}</span>`:''}${(s.spec||[]).map(x=>`<span>${x}</span>`).join('')}</div>`:'';
  document.getElementById('txt').innerHTML=`<div class="anim-in"><div class="k">${kicker}${dir}</div><h2>${s.title}</h2><p>${s.text}</p>${spec}${legend}</div>`;
  document.getElementById('counter').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${S.length}`;
  [...partsNav.children].forEach(b=>b.setAttribute('aria-current',b.dataset.part===grpOf(s.part)?'true':'false'));
  segs.forEach((sp,j)=>{sp.classList.toggle('on',j<=i);sp.classList.toggle('cur',j===i);});
  document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===S.length-1;
  if(!fromHash){try{history.replaceState(null,'','#'+(i+1));}catch(e){}}
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(cur+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();}
  else if(e.key==='f'||e.key==='F'){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}catch(err){}}
});
const fromHash=()=>{const n=parseInt((location.hash||'').slice(1),10);return isNaN(n)?0:n-1;};
window.addEventListener('hashchange',()=>go(fromHash(),true));
go(fromHash(),true);
})();
